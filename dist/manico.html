<!DOCTYPE html>
<html lang="it" data-versione="3.0.1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manico</title>
<meta name="theme-color" content="#131110">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Fraunces:opsz,wght@9..144,600..700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#131110; --panel:#1D1A18; --panel-2:#262220;
  --wood:#3A2E27; --fretwire:#8C8579; --inlay:#6B635A;
  --paper:#EDE7DD; --muted:#9C9188; --faint:#6A625B;
  --line:rgba(237,231,221,.10); --line-2:rgba(237,231,221,.18);
  --root:#E9B04A; --third:#63B7A6; --fifth:#7C9FD8; --sev:#D97C63; --ext:#A691CE;
  --r:8px; --aside:320px;
  --sans:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
:root{ --string:#B9B2A6; --nut:#EDE7DD; --pass:#D0453A;
  --wood1:#4A3A2E; --wood2:#31261D; --fret1:#C4BCAE; --fret2:#6E675C;
  --serif:"Fraunces","Georgia",serif; }

[data-tema="chiaro"]{
  --ink:#F3EDDF; --panel:#FCF9F1; --panel-2:#ECE3D0;
  --wood:#E4CD9F; --fretwire:#8A8378; --inlay:#B49A6E;
  --string:#6E675C; --nut:#3A342C;
  --wood1:#EDD9AF; --wood2:#D8BD8B; --fret1:#D4CFC5; --fret2:#8A8378;
  --paper:#28221C; --muted:#6B6259; --faint:#8D8377;
  --line:rgba(40,34,28,.13); --line-2:rgba(40,34,28,.22);
  --root:#C2831A; --third:#2C8676; --fifth:#4A6DB5; --sev:#C0573A; --ext:#785EB0;
  --pass:#BE3A2F;
}
[data-tema="chiaro"] .cell{color:rgba(255,255,255,.92)}

*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--sans);
  font-size:14px;-webkit-font-smoothing:antialiased;line-height:1.45}

/* Il banco di lavoro occupa la prima schermata, i pannelli stanno sotto. */

/* ------------------------------------------------------------------ barra */
body.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100vh;height:100dvh;overflow:hidden}
.bar{display:flex;align-items:center;gap:9px;padding:0 16px;height:56px;
  border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;flex:none}
.brand .word{font-weight:700;font-size:16px;letter-spacing:-.015em}
.brand .word b{color:var(--root)}
.brand:hover .word{color:var(--root)}
.mark{width:30px;height:24px;flex:none}
.mk-board{fill:var(--wood)} .mk-nut{stroke:var(--nut);stroke-width:2.4}
.mk-fret{stroke:var(--fretwire);stroke-width:1.1;opacity:.75}
.mk-string{stroke:var(--string);stroke-width:.9;opacity:.65} .mk-dot{fill:var(--root)}
.bar input[type=text]{flex:1;min-width:150px;max-width:520px}
.sep{width:1px;height:22px;background:var(--line-2);flex:none}
.tempo{display:flex;align-items:center;gap:8px;flex:none}
.tempo input[type=range]{width:96px}
.grow{flex:1}
.flags{display:flex;gap:4px;flex:none}
.flags button{padding:5px 8px;font-size:15px;line-height:1;opacity:.42;border-color:transparent}
.flags button.on{opacity:1;border-color:var(--root);background:var(--panel-2)}
.ver{font-family:var(--mono);font-size:10px;color:var(--faint);border:1px solid var(--line);
  border-radius:4px;padding:1px 5px;flex:none}
.cap{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);white-space:nowrap}

/* ------------------------------------------------------------- controlli */
input[type=text],textarea,select{background:var(--panel-2);border:1px solid var(--line-2);
  color:var(--paper);border-radius:var(--r);padding:8px 10px;font:inherit;outline:none;max-width:100%}
input[type=text]{font-family:var(--mono);font-size:14px}
textarea{width:100%;min-height:84px;resize:vertical;font-family:var(--mono);font-size:12px;line-height:1.5}
select{cursor:pointer;font-size:13px}
input:focus,textarea:focus,select:focus{border-color:var(--root)}
button{background:transparent;border:1px solid var(--line-2);color:var(--paper);border-radius:var(--r);
  padding:8px 11px;font:inherit;font-size:13px;cursor:pointer;
  transition:background .12s,border-color .12s,opacity .12s;white-space:nowrap}
button:hover{background:var(--panel-2);border-color:var(--faint)}
button:active{transform:scale(.98)}
:focus-visible{outline:2px solid var(--root);outline-offset:2px}
button.pri{background:var(--root);border-color:var(--root);color:#221803;font-weight:500}
button.pri:hover{background:#F0BC61}
.play{min-width:44px;font-size:12px}
.modes{display:flex;flex:none;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.seg{border:0;border-radius:0;padding:8px 11px;font-size:12px;color:var(--muted);background:transparent}
.seg + .seg{border-left:1px solid var(--line)}
.seg.on{background:var(--root);color:#221803;font-weight:500}
.seg:hover:not(.on){background:var(--panel-2);color:var(--paper)}
select.slim{padding:7px 8px;font-size:12px}
.tog{font-size:12px;padding:7px 10px}
.tog.on{background:var(--panel-2);border-color:var(--root);color:var(--root)}
.togs{display:flex;gap:6px;flex-wrap:wrap}
.val{font-family:var(--mono);font-size:12px;color:var(--paper);white-space:nowrap}
.val.dim{color:var(--faint)}
.mini{display:flex;align-items:center;gap:8px;flex:none}
.mini input[type=range]{width:104px}
.field{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.field>span:first-child{width:126px;flex:none;font-size:12px;color:var(--muted)}
.field select{flex:1;min-width:0}
.hint{font-size:12px;color:var(--faint);line-height:1.7;margin:0}
.hint b{color:var(--muted);font-weight:500}
.hint code{background:var(--panel-2);padding:1px 5px;border-radius:4px;font-family:var(--mono)}
.err{color:#D9695A}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;margin:0;height:18px}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line-2);border-radius:2px}
input[type=range]::-moz-range-track{height:3px;background:var(--line-2);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--root);margin-top:-5.5px;cursor:pointer}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--root);cursor:pointer}

/* ---------------------------------------------------------------- accordi */
.songline{margin:0;padding:9px 16px 0;font-family:var(--serif);font-size:16px;letter-spacing:-.01em}
.songline .by{color:var(--muted);font-size:13px;font-family:var(--sans)}
.ribbon{display:flex;align-items:center;gap:6px;padding:9px 16px;overflow-x:auto;overscroll-behavior:contain;
  border-bottom:1px solid var(--line);scrollbar-width:thin;flex:none;position:relative}
.chip{padding:6px 12px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--panel);
  font-family:var(--mono);font-size:13px;font-weight:600;color:var(--paper);flex:none;
  display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.25}
.chip .cn{font-size:9.5px;font-weight:400;opacity:.72;letter-spacing:.02em}
button.chip:hover{border-color:var(--faint)}
.chip.on{background:var(--root);border-color:var(--root);color:#221803}
.chip.bad{color:#D9695A;border-style:dashed}
.chip.rest{color:var(--faint)}
.bl{color:var(--faint);font-family:var(--mono);user-select:none;flex:none}

/* ------------------------------------------------------- manico e zona */
.stage{display:grid;grid-template-columns:minmax(0,1fr) auto auto;min-height:0}
.vgrip{display:flex;flex-direction:column;align-items:center;gap:8px;border:0;border-left:1px solid var(--line);
  border-radius:0;background:var(--panel-2);padding:12px 5px;cursor:pointer;width:30px}
.vgrip:hover{background:var(--panel)}
.vgrip-ch{color:var(--root);font-size:13px;transition:transform .2s}
.vgrip-txt{writing-mode:vertical-rl;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
body[data-pannello="no"] .vpanel{display:none}
body[data-pannello="no"] .vgrip-ch{transform:rotate(180deg)}
.left{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;min-height:0}
.board{display:flex;align-items:center;justify-content:center;padding:8px 12px;min-height:180px;overflow:auto}
.bwrap{position:relative;display:inline-block;max-width:100%}
.flow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.flow .ring{fill:none;stroke:var(--root);stroke-width:3.2;opacity:0;
  transition:transform .38s cubic-bezier(.3,.7,.25,1),stroke .38s,opacity .3s}
.flow .trail{stroke:var(--root);stroke-width:2.4;stroke-linecap:round;opacity:0}
.flow .trail.viva{animation:scia .5s ease-out forwards}
@keyframes scia{from{opacity:.55}to{opacity:0}}
.board svg{display:block;max-width:100%;height:auto}
.board .note{cursor:pointer}
.zoneline{display:flex;align-items:center;gap:16px;padding:9px 18px;flex-wrap:wrap;
  border-top:1px solid var(--line);background:var(--panel)}
.zdesc{font-size:12px;color:var(--muted)}
.strip{display:flex;gap:2px;flex:1;min-width:180px}
.cell{flex:1;height:22px;padding:0;border-radius:3px;border:1px solid transparent;
  font-size:10px;font-family:var(--mono);color:rgba(0,0,0,.6);min-width:0}
.cell:hover{border-color:var(--faint)}
.cell.sel{border-color:var(--paper)}
.key{display:flex;gap:13px;font-size:11px;color:var(--faint);flex-wrap:wrap;align-items:center}
.key i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}

/* ------------------------------------------------------ pannello rivolti */
.vpanel{border-left:1px solid var(--line);background:var(--panel);width:clamp(330px,30vw,470px);
  display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;min-width:0}
.vhead{padding:12px 14px 8px;display:flex;flex-direction:column;gap:9px}
.vhead h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.02em}
.vhead h2 small{color:var(--faint);font-weight:400;margin-left:6px}
.vrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vrow select{flex:1;min-width:140px}
.vrow .mini input[type=range]{width:82px}
.voices{overflow-y:auto;overscroll-behavior:contain;padding:0 14px 14px;min-height:0;position:relative;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:11px;align-content:start}
.voice{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 12px;cursor:pointer;transition:border-color .12s}
.voice:hover{border-color:var(--line-2)}
.voice.sel{border-color:var(--root)}
.voice .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.voice h4{margin:0;font-size:13px;font-weight:500}
.voice .mv{font-family:var(--mono);font-size:10px;color:var(--faint);white-space:nowrap}
.voice .meta{font-size:11px;color:var(--faint);font-family:var(--mono);margin:3px 0 8px}
.voice svg{display:block;width:100%;height:auto}
.voice .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:5px}
.voice .deg{font-family:var(--mono);font-size:12px;color:var(--muted)}
.play-s{padding:3px 8px;font-size:10px}
.empty{color:var(--faint);font-size:12px;line-height:1.7;padding:6px 0;grid-column:1/-1}

/* ----------------------------------------------------------------- attrezzi */
.tools{display:flex;align-items:center;gap:10px;padding:10px 18px;flex:none;
  border-top:2px solid var(--root);background:var(--panel)}
.tools a,.tools button{font-size:13.5px;font-weight:500;color:var(--paper);text-decoration:none;
  border:1px solid var(--line-2);border-radius:var(--r);padding:9px 16px;background:var(--panel-2)}
.tools a:hover,.tools button:hover{color:var(--root);border-color:var(--root);background:var(--panel)}

/* --------------------------------------------------------------- finestre */
dialog{background:var(--panel);color:var(--paper);border:1px solid var(--line-2);border-radius:12px;
  padding:20px;width:min(500px,93vw);max-height:88vh;overflow:auto;font-family:var(--sans)}
dialog.wide{width:min(780px,95vw)}
dialog::backdrop{background:rgba(10,9,8,.74)}
dialog h2{margin:0 0 10px;font-size:16px;font-weight:600;font-family:var(--serif)}
dialog .hint{margin-bottom:12px}
dialog select[size]{width:100%;margin-bottom:4px}
.dlg-foot{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
pre#tab{background:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0;
  overflow-x:auto;font-family:var(--mono);font-size:12px;line-height:1.55;white-space:pre}

.note.ghost{opacity:.45}
.note.ghost.hit{opacity:1}

/* La nota che sta suonando si accende. */
@keyframes hitpulse{0%{transform:scale(1.5)}55%{transform:scale(1.08)}100%{transform:scale(1)}}
.note.hit{opacity:1!important;transform-box:fill-box;transform-origin:center;
  animation:hitpulse .42s cubic-bezier(.2,.8,.3,1)}
.note.hit circle{filter:drop-shadow(0 0 7px rgba(233,176,74,.75))}
[data-tema="chiaro"] .note.hit circle{filter:drop-shadow(0 0 6px rgba(0,0,0,.35))}

@media (max-width:900px){
  body.app{height:auto;overflow:auto;display:block}
  .bar{flex-wrap:wrap;height:auto;padding:10px 14px}
  .stage{grid-template-columns:1fr;grid-template-rows:auto auto auto}
  .vgrip{width:auto;flex-direction:row;padding:8px 14px;border-left:0;border-top:1px solid var(--line)}
  .vgrip-txt{writing-mode:horizontal-tb}
  .vpanel{border-left:0;border-top:1px solid var(--line-2);width:auto}
  .voices{max-height:56vh}
  .voices{max-height:none;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .field>span:first-child{width:100px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------------------------------------------------------------- guida */
.doc{max-width:860px;margin:0 auto;padding:34px 22px 72px}
.doc-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:30px}
.doc-bar .grow{flex:1}
.lede{font-size:16px;line-height:1.7;color:var(--muted);margin:0 0 26px;max-width:64ch}
.doc h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0 0 10px;font-family:var(--serif)}
.doc h2{font-size:19px;font-weight:600;margin:34px 0 10px;padding-top:16px;border-top:1px solid var(--line);font-family:var(--serif)}
.doc h3{font-size:13px;font-weight:600;margin:20px 0 6px;color:var(--muted)}
.doc p,.doc li{font-size:14px;line-height:1.75;color:var(--paper)}
.doc p{margin:0 0 12px;max-width:70ch}
.doc ul{margin:0 0 12px;padding-left:20px;max-width:70ch}
.doc li{margin-bottom:6px}
.doc code{background:var(--panel-2);padding:2px 6px;border-radius:4px;font-family:var(--mono);font-size:12.5px}
.doc pre{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;
  overflow-x:auto;font-family:var(--mono);font-size:12px;line-height:1.6}
.doc table{border-collapse:collapse;width:100%;margin:0 0 14px;font-size:13px}
.doc th,.doc td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.doc th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:500}
.doc td:first-child{font-family:var(--mono);color:var(--root);white-space:nowrap}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--root);color:#221803;
  border-radius:var(--r);padding:11px 18px;text-decoration:none;font-weight:500;font-size:14px}
.cta:hover{background:#F0BC61}
[data-tema="chiaro"] .cta{color:#FFF7E8}
.doc .note-box{background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--root);
  border-radius:var(--r);padding:12px 14px;margin:0 0 14px}
.doc .note-box p:last-child{margin:0}
.doc-foot{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:var(--faint);line-height:1.8}
.doc-foot a{color:var(--muted)}

/* ------------------------------------------------------------ scaffale */
html{scroll-behavior:smooth}
.panel{scroll-margin-top:18px}
.shelf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px 18px;border-top:1px solid var(--line-2);background:var(--panel-2)}
.shelf-cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-right:2px}
.shelf a{font-size:12.5px;color:var(--muted);text-decoration:none;
  border:1px solid var(--line-2);border-radius:var(--r);padding:6px 11px;transition:.12s}
.shelf a:hover{color:var(--root);border-color:var(--root);background:var(--panel)}
.shelf-arrow{margin-left:auto;color:var(--root);font-size:15px;animation:giu 2.4s ease-in-out infinite}
@keyframes giu{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(4px);opacity:1}}
@media (prefers-reduced-motion:reduce){.shelf-arrow{animation:none}}
@media (max-width:900px){.shelf{position:sticky;bottom:0;z-index:4}}

/* --------------------------------------------------- fascia dei voicing */
.voicing{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;overflow:hidden}
.vhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 18px 10px}
.vhead h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.vhead h2 small{color:var(--faint);font-weight:400;margin-left:6px}
.vhead select{min-width:170px}
.vhead .hint{margin:0;max-width:38ch}
.voices{overflow-y:auto;overscroll-behavior:contain;padding:0 18px 16px;min-height:0;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;align-content:start}

</style>
<script>
  (function () {
    var t = 'scuro';
    try { var v = localStorage.getItem('manico-tema'); if (v === 'chiaro' || v === 'scuro') t = v; else
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'scuro' : 'chiaro';
    } catch (e) {}
    document.documentElement.setAttribute('data-tema', t);
  })();
</script>
</head>
<body class="app">

<header class="bar">
  <a class="brand" href="https://basso.massimodanieli.com/" data-tt="bar.guide">
    <svg class="mark" viewBox="0 0 30 24" aria-hidden="true">
      <rect x="0.5" y="2.5" width="29" height="19" rx="3" class="mk-board"/>
      <line x1="4" y1="2.5" x2="4" y2="21.5" class="mk-nut"/>
      <line x1="12" y1="2.5" x2="12" y2="21.5" class="mk-fret"/>
      <line x1="20" y1="2.5" x2="20" y2="21.5" class="mk-fret"/>
      <line x1="0.5" y1="6.5" x2="29.5" y2="6.5" class="mk-string"/>
      <line x1="0.5" y1="11" x2="29.5" y2="11" class="mk-string"/>
      <line x1="0.5" y1="15.5" x2="29.5" y2="15.5" class="mk-string"/>
      <line x1="0.5" y1="20" x2="29.5" y2="20" class="mk-string"/>
      <circle cx="16" cy="11" r="3.2" class="mk-dot"/>
    </svg>
    <span class="word">Manico<b>.</b></span>
  </a>

  <input type="text" id="seq" value="C-7 F7 Bbdim7 Ebdim7" spellcheck="false" autocomplete="off"
         data-tt="bar.gridTitle" aria-label="chart">
  <button class="pri" id="go" data-t="bar.show">Mostra</button>

  <span class="sep"></span>
  <button class="pri play" id="pp">&#9654;</button>
  <span class="modes" id="modes"></span>
  <select id="beats" class="slim" data-tt="play.meter">
    <option value="4">4/4</option><option value="3">3/4</option><option value="2">2/4</option><option value="6">6/8</option>
  </select>
  <label class="tempo" data-tt="bar.tempo">
    <input type="range" id="bpm" min="40" max="200" step="1" value="92">
    <span class="val" id="bpmv">92</span>
  </label>

  <span class="grow"></span>

  <span class="flags">
    <button data-lang="it" title="Italiano" aria-label="Italiano"><span class="fl">🇮🇹</span></button>
    <button data-lang="en" title="English" aria-label="English"><span class="fl">🇬🇧</span></button>
  </span>
  <button id="tema" class="tog">Chiaro</button>
  <span class="ver">v3.0.1</span>
</header>

<main class="stage">
  <section class="left">
    <p class="songline" id="songline" hidden></p>
    <nav class="ribbon" id="chips"></nav>

    ['maj13', [0, 4, 7, 11, 14, 21]], ['maj9', [0, 4, 7, 11, 14]], ['maj7', [0, 4, 7, 11]],
    ['maj6', [0, 4, 7, 9]], ['m7b5', [0, 3, 6, 10]], ['mmaj7', [0, 3, 7, 11]],
    ['dim7', [0, 3, 6, 9]], ['dim', [0, 3, 6]],
    ['m11', [0, 3, 7, 10, 14, 17]], ['m9', [0, 3, 7, 10, 14]], ['m7', [0, 3, 7, 10]],
    ['m69', [0, 3, 7, 9, 14]], ['m6', [0, 3, 7, 9]],
    ['7sus4', [0, 5, 7, 10]], ['sus4', [0, 5, 7]], ['sus2', [0, 2, 7]],
    ['alt', [0, 4, 8, 10, 15]], ['7b9', [0, 4, 7, 10, 13]], ['7#9', [0, 4, 7, 10, 15]],

    ['13', [0, 4, 7, 10, 14, 21]], ['11', [0, 4, 7, 10, 14, 17]], ['9', [0, 4, 7, 10, 14]],
    ['7', [0, 4, 7, 10]], ['69', [0, 4, 7, 9, 14]], ['6/9', [0, 4, 7, 9, 14]],
    ['add9', [0, 4, 7, 14]], ['6', [0, 4, 7, 9]], ['aug', [0, 4, 8]], ['5', [0, 7]],

      .replace(/\u00f87?/g, 'm7b5')       // cerchio barrato

    { id: 'shell',   block: true,  size: 3 },
    { id: 'guide',   block: true,  size: 2 },

      const cands = notes.filter(n =>
        n.midi > cur.midi && n.midi <= cur.midi + 8 && n.si >= cur.si && n.si <= cur.si + 1);
      if (!cands.length) break;

      cur = best;

      if (acc.length === size) { res.push(acc.slice()); return; }
      for (let i = start; i < notes.length; i++) {

    for (let i = 0; i < k; i++) t += Math.abs(x[i] - y[i]);

   * Programmazione dinamica: sceglie un voicing per accordo minimizzando il movimento

   * Ritorna un array di indici, -1 dove non c'e' scelta.

  function optimise(candidates) {

    const out = candidates.map(() => -1);
    if (!idx.length) return out;

    let prevCosts = candidates[idx[0]].map(() => 0);
    const back = [];

    for (let step = 1; step < idx.length; step++) {
      const cur = candidates[idx[step]], prev = candidates[idx[step - 1]];
      const costs = new Array(cur.length).fill(Infinity);
      const from = new Array(cur.length).fill(0);
      cur.forEach((cv, j) => {
        prev.forEach((pv, i) => {
          const c = prevCosts[i] + moveCost(pv, cv) + cv.span * 0.5;
          if (c < costs[j]) { costs[j] = c; from[j] = i; }
        });
      });
      back.push(from);
      prevCosts = costs;
    }

    let best = 0;
    prevCosts.forEach((c, i) => { if (c < prevCosts[best]) best = i; });
    const chosen = new Array(idx.length);
    chosen[idx.length - 1] = best;
    for (let step = idx.length - 1; step > 0; step--) chosen[step - 1] = back[step - 1][chosen[step]];
    idx.forEach((seqIndex, k) => { out[seqIndex] = chosen[k]; });
    return out;
  }

  return { VOICING_TYPES, typeById, zoneNotes, span, inversion, generate, describe, degrees, moveCost, motion, optimise };

      const daX = parseFloat(ring.dataset.x), daY = parseFloat(ring.dataset.y);
      const mosso = !Number.isNaN(daX) && (Math.abs(daX - n.p.x) > 0.5 || Math.abs(daY - n.p.y) > 0.5);
      if (mosso && trail) {
        trail.setAttribute('x1', daX); trail.setAttribute('y1', daY);
        trail.setAttribute('x2', n.p.x); trail.setAttribute('y2', n.p.y);
        trail.classList.remove('viva');
        void trail.getBoundingClientRect();
        trail.classList.add('viva');
      }
      ring.dataset.x = n.p.x; ring.dataset.y = n.p.y;
      ring.style.opacity = '1';
      ring.style.stroke = degreeVar(n.iv, item ? item.chord : null);
      ring.style.transform = `translate(${n.p.x}px, ${n.p.y}px)`;
    });

    for (let k = mete.length; k < anelli.length; k++) anelli[k].style.opacity = '0';
  }

  /** Colore del grado, per gli anelli. */
  function degreeVar(iv, chord) {
    if (!chord) return 'var(--root)';
    if (iv === 0) return 'var(--root)';
    if (iv === chord.third) return 'var(--third)';
    if (iv === chord.fifth) return 'var(--fifth)';
    if (iv >= 9 && iv <= 11) return 'var(--sev)';
    return 'var(--ext)';
  }

  function walkGhosts() {
    if (state.playMode !== 'walking') return [];
    const nb = Math.max(1, Math.round(state.beats * ((state.grid[state.index] || {}).dur || 1)));
    return walkingLine(state.index, nb).filter(n => n && n.pass);
  }

  function ensureBoardWrap() {
    const box = $('board');
    if (!box.querySelector('.bwrap')) {
      box.innerHTML = '<div class="bwrap"><div class="bstatic"></div>'
        + '<svg class="flow" xmlns="http://www.w3.org/2000/svg"></svg></div>';
    }
    return box.querySelector('.bwrap');
  }

  function renderBoard() {
    const item = state.grid[state.index];
    const v = chosen(state.index);
    ensureBoardWrap().querySelector('.bstatic').innerHTML = R.fretboard({
      chord: item && item.ok ? item.chord : null,
      open: open(), zoneFrom: state.zoneFrom, zoneTo: zoneTo(), frets: state.frets,
      labels: state.labels, flipped: state.flipped, dimOutside: state.dimOutside,
      highlight: v ? v.shape : [],
      ghosts: walkGhosts()
    });
    fitBoard();
    updateFlow(state.index);
  }

  function invLabel(chord, bassIv) {
    const k = V.inversion(chord, bassIv);
    return k === null ? t('inv.x') : t('inv.' + k);
  }

  function renderVoicings() {
    const item = state.grid[state.index];
    const type = V.typeById(state.vtype);
    $('vhint').textContent = t('vt.' + type.id + '.hint');

    if (!item || !item.ok) {
      $('vcount').textContent = '';
      $('voices').innerHTML = `<p class="empty">${t('v.none')}</p>`;
      return;
    }

    const list = candidates(state.index);
    $('vcount').textContent = list.length
      ? t('v.count', list.length, item.chord.symbol, state.zoneFrom, zoneTo())
      : item.chord.symbol;
    if (!list.length) {
      $('voices').innerHTML = `<p class="empty">${t('v.empty', t('vt.' + type.id + '.name'), state.zoneFrom, zoneTo())}</p>`;
      return;
    }

    const cur = chosen(state.index);
    const prev = previousVoicing(state.index);

    $('voices').innerHTML = list.map((v, k) => {
      const mv = V.motion(prev, v);
      return `<div class="voice${cur === v ? ' sel' : ''}" data-voicing="${k}">
        <div class="head"><h4>${invLabel(item.chord, v.bassIv)}</h4><span class="mv">${mv === null ? '' : t('v.motion', mv)}</span></div>
        <div class="meta">${V.describe(v, item.chord)} \u00b7 ${t('v.spanOf', v.span)}</div>
        ${R.diagram(item.chord, v, { open: open(), zoneFrom: state.zoneFrom, zoneTo: zoneTo(), flipped: state.flipped })}
        <div class="foot">
          <span class="deg">${V.degrees(v, item.chord)}</span>
          <button class="play-s" data-hear="${k}" aria-label="${t('v.listen')}">&#9654;</button>
        </div></div>`;
    }).join('');
    const sel = $('voices').querySelector('.voice.sel');
    if (sel) {
      const v = $('voices');
      const y = Math.max(0, sel.offsetTop - (v.clientHeight - sel.offsetHeight) / 2);
      if (v.scrollTo) v.scrollTo({ top: y, behavior: 'smooth' }); else v.scrollTop = y;
    }
  }

  function previousVoicing(i) {
    for (let k = i - 1; k >= 0; k--) if (state.grid[k].ok) return chosen(k);
    return null;
  }

  function render() {
    describeZone(); renderChips(); renderStrip(); renderBoard(); renderVoicings();
  }

  // ---------------------------------------------------------------- suono

  let flashes = [];

  function clearFlashes() {
    flashes.forEach(clearTimeout);
    flashes = [];
    document.querySelectorAll('.note.hit').forEach(el => el.classList.remove('hit'));
  }

  /** Accende la nota sul manico e sul diagramma del voicing scelto. */
  function flash(note) {
    const sel = `[data-pos="${note.si}:${note.f}"]`;
    document.querySelectorAll('#board ' + sel + ', .voice.sel ' + sel).forEach(el => {
      el.classList.remove('hit');
      void el.getBoundingClientRect();   // forza il riavvio dell'animazione
      el.classList.add('hit');
    });
  }

  /** Programma l'accensione delle note in sincrono con quello che si sente. */
  function lightUp(v, step) {
    clearFlashes();
    if (!v) return;
    if (v.block) { v.shape.forEach(n => flash(n)); return; }
    v.shape.forEach((n, i) => {
      if (i === 0) { flash(n); return; }
      flashes.push(setTimeout(() => flash(n), i * step * 1000));
    });
  }

  function hear(v, seconds) {
    if (!v) return;
    const midis = v.shape.map(n => n.midi);
    if (v.block) {
      A.strum(midis, Math.min(seconds || 1.6, 2.2));
      lightUp(v, 0);
    } else {
      const step = Math.min((seconds || 1.6) / midis.length, 0.42);
      A.arpeggio(midis, step);
      lightUp(v, step);
    }
  }

  function select(i) {
    state.index = i;
    renderChips(); renderBoard(); renderVoicings();
    if (!state.playing) hear(chosen(i), 1.2);
  }

  /** Trova una posizione in zona per un midi qualsiasi, anche fuori dall'accordo. */
  function findPos(midi) {
    const o = open();
    for (let si = o.length - 1; si >= 0; si--) {
      const f = midi - o[si];
      if (f >= state.zoneFrom && f <= zoneTo()) return { si, f, midi, pc: ((midi % 12) + 12) % 12, iv: -2 };
    }
    return null;
  }

  /**
   * Linea walking essenziale dentro la zona: fondamentale, due note dell'accordo in
   * salita, nota cromatica di avvicinamento alla fondamentale dell'accordo successivo.
   */
  function walkingLine(i, beats) {
    const item = state.grid[i];
    if (!item || !item.ok) return [];
    const notes = V.zoneNotes(item.chord, open(), state.zoneFrom, zoneTo());
    if (!notes.length) return [];
    const v = chosen(i);
    const root = (v && v.shape[0]) || notes.find(n => n.iv === 0) || notes[0];

    // Dove sta andando la linea: la fondamentale del prossimo accordo utile.
    let target;
    for (let k = 1; k <= state.grid.length; k++) {
      const j = (i + k) % state.grid.length;
      if (!state.grid[j].ok) continue;
      const vNext = chosen(j);
      target = (vNext && vNext.shape[0].midi)
        || (V.zoneNotes(state.grid[j].chord, open(), state.zoneFrom, zoneTo())[0] || {}).midi;
      break;
    }

    // Le note dell'accordo si percorrono nella direzione del bersaglio,
    // e l'avvicinamento cromatico arriva dal lato del moto: da sotto se si
    // sale, da sopra se si scende. E' la grammatica classica del walking.
    const giu = target !== undefined && target < root.midi;
    const tones = notes
      .filter(n => (giu ? n.midi < root.midi : n.midi > root.midi) && n.pc !== root.pc)
      .sort((a, b) => (giu ? b.midi - a.midi : a.midi - b.midi));
    const passi = tones.length ? tones : [root];
    let appr = null;
    if (target !== undefined) {
      appr = (giu ? findPos(target + 1) : findPos(target - 1))
          || (giu ? findPos(target - 1) : findPos(target + 1));
      if (appr) appr = { ...appr, pass: true };
    }

    const linea = [root];
    for (let b = 1; b < beats - 1; b++) linea.push(passi[(b - 1) % passi.length]);
    if (beats > 1) linea.push(appr || passi[passi.length - 1] || root);
    return linea;
  }

  /** Rumore deterministico: stesso giro e stessa battuta, stesso fraseggio. */
  function seme(a, b) {
    let x = (a * 374761393 + b * 668265263 + 1442695040888963) >>> 0;
    return () => {
      x = (x ^ (x << 13)) >>> 0; x = (x ^ (x >> 17)) >>> 0; x = (x ^ (x << 5)) >>> 0;
      return x / 4294967296;
    };
  }

  /**
   * Il fraseggio del walking: semiminime come impianto, ornamenti idiomatici sopra.
   * Ogni evento ha posizione e durata in movimenti; lo swing sta nei 2/3 del tempo.
   */
  function walkingEvents(i, giro) {
    const item = state.grid[i];
    if (!item || !item.ok) return [];
    const dur = item.dur || 1;
    const rnd = seme(i * 31 + 7, giro * 101 + 13);
    const ev = [];

    // 6/8: due pulsazioni puntate (1 e 4), non sei note uguali.
    if (state.beats === 6) {
      const linea = walkingLine(i, 2);
      if (!linea.length) return [];
      ev.push({ n: linea[0], at: 0, len: 2.6, vol: 0.36 });
      if (linea[1] && dur >= 1) ev.push({ n: linea[1], at: 3, len: 2.4, vol: 0.3 });
      return ev;
    }

    const nb = Math.max(1, Math.round(state.beats * dur));
    const linea = walkingLine(i, nb);
    if (!linea.length) return [];

    linea.forEach((n, b) => {
      if (n) ev.push({ n, at: b, len: 0.92, vol: b === 0 ? 0.36 : 0.3 });
    });

    // Con meno di tre movimenti non c'e' spazio per ornamenti.
    if (nb < 3) return ev;

    // Salto d'ottava sul terzo movimento, quando la zona lo consente.
    if (rnd() < 0.25) {
      const su = findPos(linea[0].midi + 12);
      if (su && ev[2]) { ev[2] = { ...ev[2], n: su }; }
    }

    // Ultimo movimento in due ottavi swingati: nota dell'accordo, poi il passaggio.
    if (rnd() < 0.5 && ev.length >= 2) {
      const ultimo = ev[ev.length - 1];
      const prima = ev[ev.length - 2];
      ultimo.len = 0.6;
      ev.push({ n: ultimo.n, at: ultimo.at + 2 / 3, len: 0.3, vol: 0.28 });
      ultimo.n = prima.n;
    }

    // Ghost percussiva sul levare del secondo movimento.
    if (rnd() < 0.35 && ev[1]) {
      ev.push({ n: ev[1].n, at: 1 + 2 / 3, len: 0.07, vol: 0.12, ghost: true });
    }

    return ev.sort((a, b) => a.at - b.at);
  }

  // ---------------------------------------------------------------- trasporto

  function tick() {
    if (!state.playing) return;
    if (state.index === 0) state.giro = (state.giro || 0) + 1;
    const item = state.grid[state.index];
    if (!item) { stop(); return; }
    const seconds = (60 / state.bpm) * state.beats * (item.dur || 1);

    if (!state.lockZone && item.ok) {
      const b = bestZone([item]);
      if (b !== null && b !== state.zoneFrom) setZone(b, true);
    }
    renderChips(); renderBoard(); renderVoicings();

    if (state.metronome) {
      const beats = Math.max(1, Math.round(state.beats * (item.dur || 1)));
      for (let b = 0; b < beats; b++) A.click(b * (60 / state.bpm), item.first && b === 0);
    }
    if (item.ok && state.playMode !== 'mute') {
      if (state.playMode === 'walking') {
        const beatSec = 60 / state.bpm;
        clearFlashes();
        walkingEvents(state.index, state.giro || 0).forEach(ev => {
          A.pluck(ev.n.midi, ev.at * beatSec, ev.len * beatSec, ev.vol);
          flashes.push(setTimeout(() => flash(ev.n), ev.at * beatSec * 1000));
        });
      } else {
        const v = chosen(state.index);
        if (v) {
          if (state.playMode === 'root') {
            A.pluck(v.shape[0].midi, 0, Math.min(seconds * 0.9, 1.6), 0.3);
            clearFlashes(); flash(v.shape[0]);
          } else hear(v, seconds * 0.92);
        }
      }
    }
    // Le voci partono verso il prossimo accordo poco prima del cambio,
    // cosi' arrivano sull'attacco: il voice leading si vede accadere.
    const prossimo = (state.index + 1) % state.grid.length;
    if (state.grid[prossimo] && state.grid[prossimo].ok) {
      flashes.push(setTimeout(() => updateFlow(prossimo), Math.max(60, (seconds - 0.38) * 1000)));
    }
    state.timer = setTimeout(() => {
      state.index = (state.index + 1) % state.grid.length;
      tick();
    }, seconds * 1000);
  }
  function stop() {
    state.playing = false;
    clearTimeout(state.timer);
    clearFlashes();
    $('pp').innerHTML = '&#9654;';
  }
  function toggleTransport() {
    state.playing = !state.playing;
    $('pp').innerHTML = state.playing ? '&#9632;' : '&#9654;';
    if (state.playing) { A.audio(); tick(); } else { clearTimeout(state.timer); clearFlashes(); }
  }

  // ---------------------------------------------------------------- voice leading

  function optimiseVoiceLeading() {
    const lists = state.grid.map((x, i) => (x.ok ? candidates(i) : []));
    const picks = V.optimise(lists);
    picks.forEach((p, i) => { if (p >= 0) state.pick[i] = p; });
    render();
    const total = totalMotion();
    $('vlinfo').textContent = total === null ? '' : t('v.total', total);
  }
  function totalMotion() {
    let sum = 0, prev = null, seen = false;
    state.grid.forEach((x, i) => {
      if (!x.ok) return;
      const v = chosen(i);
      if (!v) return;
      if (prev) { sum += V.motion(prev, v); seen = true; }
      prev = v;
    });
    return seen ? sum : null;
  }

  // ---------------------------------------------------------------- tab

  function buildTab() {
    const walking = $('tabmode') && $('tabmode').value === 'walk';
    const bars = [];
    let current = null, barIndex = -1;
    state.grid.forEach((item, i) => {
      if (item.bar !== barIndex) { current = { label: [], columns: [], block: false }; bars.push(current); barIndex = item.bar; }
      if (!item.ok) { current.label.push(item.raw); return; }
      current.label.push(item.chord.symbol);
      if (walking) {
        const nb = Math.max(1, Math.round(state.beats * (item.dur || 1)));
        walkingLine(i, nb).forEach(n => {
          if (n) current.columns.push({ si: n.si, f: n.f, pass: !!n.pass });
        });
        return;
      }
      const v = chosen(i);
      if (!v) return;
      current.block = current.block || v.block;
      v.shape.forEach((n, k) => current.columns.push({ si: n.si, f: n.f, newGroup: v.block && k === 0 }));
    });

    const modo = walking ? t('tab.walk') : t('vt.' + state.vtype + '.name');
    let header = t('tab.head', $('seq').value, t('tun.' + state.tuning),
      state.zoneFrom, zoneTo(), modo);
    if (walking) header += '\n' + t('tab.legend');
    $('tab').textContent = Tab.render(bars, open(), state.flipped, +$('perline').value, header);
    $('tab').dataset.vuoto = 'no';
  }

  // ---------------------------------------------------------------- eventi

  function loadGrid(text, autozone) {
    $('seq').value = text;
    parseGrid();
    if (autozone) {
      setLock(false);
      const b = bestZone(state.grid, 0);
      if (b !== null) setZone(b, true);
    }
    render();
  }

  function buildMenus() {
    const keep = { lib: $('lib').value, vtype: $('vtype').value, tun: $('tun').value,
                   nfrets: $('nfrets').value, perline: $('perline').value,
                   tabmode: $('tabmode').value };
    $('lib').innerHTML = LIBRARY.map((x, i) =>
      `<option value="${i}">${x[lang() === 'en' ? 1 : 0]} \u00b7 ${x[2]} \u00b7 ${x[3]} bpm</option>`).join('');
    $('vtype').innerHTML = V.VOICING_TYPES.map(x => `<option value="${x.id}">${t('vt.' + x.id + '.name')}</option>`).join('');
    $('tun').innerHTML = ['4', '5', '5c', '6'].map(k => `<option value="${k}">${t('tun.' + k)}</option>`).join('');
    $('nfrets').innerHTML = [12, 15, 18, 24].map(n => `<option value="${n}">${t('set.fretsTo', n)}</option>`).join('');
    $('modes').innerHTML = ['voicing', 'root', 'walking', 'mute'].map(m =>
      `<button class="seg${state.playMode === m ? ' on' : ''}" data-mode="${m}" title="${t('play.' + m)}">${t('mode.' + m)}</button>`).join('');
    $('perline').innerHTML = [4, 2, 6].map(n => `<option value="${n}">${t('tab.perline', n)}</option>`).join('');
    $('tabmode').innerHTML = `<option value="blocks">${t('tab.blocks')}</option><option value="walk">${t('tab.walk')}</option>`;
    $('lib').value = keep.lib || '0';
    $('vtype').value = keep.vtype || state.vtype;
    $('tun').value = keep.tun || state.tuning;
    $('nfrets').value = keep.nfrets || String(state.frets);

    $('perline').value = keep.perline || '4';
    $('tabmode').value = keep.tabmode || 'blocks';
    $('tlab').textContent = state.labels === 'degrees' ? t('set.degrees') : t('set.names');
    $('pp').innerHTML = state.playing ? '&#9632;' : '&#9654;';
    $('zwv').textContent = t('zone.frets', state.zoneWidth);
    if ($('tab').textContent.trim() === '' || $('tab').dataset.vuoto === 'si') {
      $('tab').textContent = t('tab.press'); $('tab').dataset.vuoto = 'si';
    }
  }

  function closeDialog(d) {
    if (typeof d.close === 'function') d.close(); else d.removeAttribute('open');
  }

  /** Zona fissa: stato e pulsante sempre allineati. */
  function setLock(v) {
    state.lockZone = v;
    const b = $('lock');
    if (b) b.classList.toggle('on', v);
  }

  function init() {
    initTheme();
    initLang(() => { buildMenus(); refreshThemeLabel(); render(); });
    parseGrid();
    render();

    buildMenus();

    $('go').onclick = () => { parseGrid(); render(); };
    $('seq').addEventListener('keydown', e => { if (e.key === 'Enter') { parseGrid(); render(); } });

    // La griglia si aggiorna da sola poco dopo l'ultima battitura: il pulsante resta
    // per chi preferisce confermare a mano.
    let attesa = null;
    $('seq').addEventListener('input', () => {
      setSongTitle(null);
      clearTimeout(attesa);
      attesa = setTimeout(() => { parseGrid(); render(); }, 550);
    });

    $('libgo').onclick = () => {
      const voce = LIBRARY[+$('lib').value];
      state.bpm = voce[3];
      $('bpm').value = voce[3];
      $('bpmv').textContent = voce[3];
      setSongTitle(voce[lang() === 'en' ? 1 : 0], '');
      loadGrid(voce[4], true);
      closeDialog($('dlgforme'));
    };

    $('vtype').onchange = e => {
      state.vtype = e.target.value;
      state.pick = {}; cache = new Map();
      $('spanwrap').style.display = V.typeById(state.vtype).block ? '' : 'none';
      $('vlinfo').textContent = '';
      render();
    };
    $('span').oninput = e => {
      state.maxSpan = +e.target.value;
      $('spanv').textContent = state.maxSpan;
      state.pick = {}; cache = new Map(); render();
    };
    $('vl').onclick = optimiseVoiceLeading;

    $('tun').onchange = e => { state.tuning = e.target.value; state.pick = {}; cache = new Map(); render(); };
    if ($('nfrets')) {
    $('nfrets').value = String(state.frets);
    $('nfrets').onchange = e => {
      state.frets = +e.target.value;
      $('zs').max = state.frets - state.zoneWidth + 1;
      if (state.zoneFrom > state.frets - state.zoneWidth + 1) { setZone(state.frets - state.zoneWidth + 1); return; }
      state.pick = {}; cache = new Map(); render();
    };
    }
    $('zs').oninput = e => { setLock(true); setZone(+e.target.value); };
    $('zw').oninput = e => {
      setLock(true);
      state.zoneWidth = +e.target.value;
      $('zwv').textContent = t('zone.frets', state.zoneWidth);
      $('zs').max = state.frets - state.zoneWidth + 1;
      state.pick = {}; cache = new Map();
      if (state.zoneFrom > state.frets - state.zoneWidth + 1) setZone(state.frets - state.zoneWidth + 1);
      else render();
    };
    $('tlab').onclick = e => {
      state.labels = state.labels === 'degrees' ? 'notes' : 'degrees';
      e.target.textContent = state.labels === 'degrees' ? t('set.degrees') : t('set.names');
      e.target.classList.toggle('on', state.labels === 'degrees');
      render();
    };
    $('tflip').onclick = e => { state.flipped = !state.flipped; e.target.classList.toggle('on', state.flipped); render(); };
    $('tdim').onclick = e => { state.dimOutside = !state.dimOutside; e.target.classList.toggle('on', state.dimOutside); render(); };

    $('pp').onclick = toggleTransport;
    $('bpm').oninput = e => { state.bpm = +e.target.value; $('bpmv').textContent = state.bpm; };
    $('beats').onchange = e => { state.beats = +e.target.value; };
    $('modes').addEventListener('click', e => {
      const b = e.target.closest('[data-mode]');
      if (!b) return;
      state.playMode = b.dataset.mode;
      $('modes').querySelectorAll('.seg').forEach(x => x.classList.toggle('on', x === b));
      renderBoard();
    });
    $('clk').onclick = e => { state.metronome = !state.metronome; e.target.classList.toggle('on', state.metronome); };
    $('lock').onclick = () => setLock(!state.lockZone);

    $('mktab').onclick = buildTab;
    $('tab').dataset.vuoto = 'si';
    $('perline').onchange = buildTab;
    $('cptab').onclick = () => {
      navigator.clipboard && navigator.clipboard.writeText($('tab').textContent).then(() => {
        $('cptab').textContent = t('tab.copied');
        setTimeout(() => { $('cptab').textContent = t('tab.copy'); }, 1200);
      });
    };
    $('dltab').onclick = () => {
      const blob = new Blob([$('tab').textContent], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'manico-tab.txt';
      a.click();
      URL.revokeObjectURL(a.href);
    };

    $('irgo').onclick = () => {
      const info = $('irinfo'), list = $('irlist');
      const raw = $('ireal').value.trim();
      if (!raw) { info.innerHTML = `<span class="err">${t('ir.empty')}</span>`; return; }
      let songs = [];
      try { songs = IReal.parse(raw); } catch (e) { songs = []; }
      if (!songs.length) {
        list.style.display = 'none';
        info.innerHTML = `<span class="err">${t('ir.bad')}</span>`;
        return;
      }
      state.songs = songs;
      list.style.display = songs.length > 1 ? '' : 'none';
      list.innerHTML = songs.map((s, i) => `<option value="${i}">${s.title}${s.composer ? ' \u2014 ' + s.composer : ''}</option>`).join('');
      loadSong(0);
    };
    $('irlist').onchange = e => loadSong(+e.target.value);

    // Delega degli eventi sui contenuti ridisegnati.
    $('chips').addEventListener('click', e => {
      const b = e.target.closest('[data-pick]');
      if (b) select(+b.dataset.pick);
    });
    $('strip').addEventListener('click', e => {
      const b = e.target.closest('[data-zone]');
      if (b) { setLock(true); setZone(+b.dataset.zone); }
    });
    $('voices').addEventListener('click', e => {
      const hearBtn = e.target.closest('[data-hear]');
      if (hearBtn) { e.stopPropagation(); hear(candidates(state.index)[+hearBtn.dataset.hear], 1.6); return; }
      const card = e.target.closest('[data-voicing]');
      if (card) {
        state.pick[state.index] = +card.dataset.voicing;
        renderChips(); renderBoard(); renderVoicings();
        hear(chosen(state.index), 1.4);
      }
    });
    $('board').addEventListener('click', e => {
      const g = e.target.closest('[data-midi]');
      if (g) A.pluck(+g.dataset.midi);
    });

    window.addEventListener('resize', fitBoard);
    document.addEventListener('keydown', e => {
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
      if (document.querySelector('dialog[open]')) return;
      if (e.code === 'Space') { e.preventDefault(); toggleTransport(); }
      if (e.key === 'ArrowRight' && state.index < state.grid.length - 1) select(state.index + 1);
      if (e.key === 'ArrowLeft' && state.index > 0) select(state.index - 1);
    });

    $('spanwrap').style.display = 'none';

    // Pannello dei voicing a scomparsa: chi suona decide se vederlo.
    try {
      if (localStorage.getItem('manico-pannello') === 'no') document.body.dataset.pannello = 'no';
    } catch (e) { /* archiviazione non disponibile */ }
    $('vtoggle').onclick = () => {
      const chiuso = document.body.dataset.pannello === 'no';
      if (chiuso) delete document.body.dataset.pannello;
      else document.body.dataset.pannello = 'no';
      try { localStorage.setItem('manico-pannello', chiuso ? 'si' : 'no'); } catch (e) { /* niente */ }
      fitBoard();
    };

    document.querySelectorAll('[data-apre]').forEach(b => {
      b.onclick = () => {
        const d = $(b.dataset.apre);
        if (b.dataset.apre === 'dlgtab') buildTab();
        if (d.showModal) d.showModal(); else d.setAttribute('open', '');
      };
    });
    document.querySelectorAll('dialog').forEach(d => {
      d.querySelectorAll('[data-close]').forEach(b => { b.onclick = () => closeDialog(d); });
      d.addEventListener('click', e => { if (e.target === d) closeDialog(d); });
    });
  }

  function setSongTitle(title, composer) {
    state.song = title ? { title, composer } : null;
    const el = $('songline');
    if (!el) return;
    if (!state.song) { el.hidden = true; el.innerHTML = ''; return; }
    el.hidden = false;
    el.innerHTML = `<b>${title}</b>${composer ? ` <span class="by">\u2014 ${composer}</span>` : ''}`;
  }

  function loadSong(k) {
    const song = state.songs[k];
    if (!song) return;
    loadGrid(IReal.toGrid(song), true);
    setSongTitle(song.title, song.composer);
    $('irinfo').textContent = t('ir.loaded', song.title, song.composer, song.key, song.bars.length);
    // Brano caricato: la finestra ha fatto il suo lavoro.
    closeDialog($('dlgireal'));
  }

  window.MANICO = { versione: document.documentElement.dataset.versione || '?', fraseggio: walkingEvents };

  try {
    init();
  } catch (err) {
    // Un elemento mancante non deve spegnere tutta la pagina.
    console.error('Manico: inizializzazione interrotta', err);
  }

  return {  };
})();

})();
</script>
</body>
</html>
