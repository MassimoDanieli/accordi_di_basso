name: Deploy site

# Publishes the site to GitHub Pages together with the bass-separation engine, which is too
# large for the repository and is built here from pinned npm packages.
# Requires Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Test
        run: npm test
      - name: Restore the separation engine packages
        uses: actions/cache@v4
        with:
          path: .separator
          key: separator-${{ hashFiles('tools/build-separator.js') }}
      - name: Build the separation engine
        run: node tools/build-separator.js
      - name: Assemble the site
        run: |
          mkdir _site
          cp index.html index.en.html app.html help-it.html help-en.html about.html CNAME LICENSE _site/
          cp -r assets dist _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
