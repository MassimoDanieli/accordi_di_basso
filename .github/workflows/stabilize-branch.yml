name: One-time branch stabilization

on:
  push:
    branches: [fix/stabilize-release-4.4.1]
    paths:
      - '.github/workflows/stabilize-branch.yml'

permissions:
  contents: write

jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Apply targeted source fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(filename, old, new):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{filename}: expected one match, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'src/app.js',
              "lock: state.lock, trasp: state.trasp || 0,",
              "lock: state.lockZone, trasp: state.trasp || 0,"
          )

          replace_once(
              'src/app.js',
              "  if (p.zw) { $('zw').value = p.zw; $('zwv').textContent = p.zw; }\n"
              "  if (typeof p.zoneFrom === 'number') { state.lock = !!p.lock; setZone(p.zoneFrom); $('zs').value = p.zoneFrom; }",
              "  if (p.zw) {\n"
              "    state.zoneWidth = +p.zw;\n"
              "    $('zw').value = String(state.zoneWidth);\n"
              "    $('zwv').textContent = t('zone.frets', state.zoneWidth);\n"
              "    $('zs').max = state.frets - state.zoneWidth + 1;\n"
              "  }\n"
              "  if (typeof p.zoneFrom === 'number') {\n"
              "    setLock(!!p.lock);\n"
              "    const maxFrom = Math.max(0, state.frets - state.zoneWidth + 1);\n"
              "    setZone(Math.min(Math.max(0, p.zoneFrom), maxFrom));\n"
              "  }"
          )

          replace_once(
              'src/canzoniere.js',
              "  const st = db.transaction(STORE, 'readwrite').objectStore(STORE);\n"
              "  const r = await att(st.get(id));\n"
              "  if (r) { r.pref = p; await att(st.put(r)); }",
              "  const readStore = db.transaction(STORE, 'readonly').objectStore(STORE);\n"
              "  const r = await att(readStore.get(id));\n"
              "  if (!r) return;\n"
              "  r.pref = p;\n"
              "  const writeStore = db.transaction(STORE, 'readwrite').objectStore(STORE);\n"
              "  await att(writeStore.put(r));"
          )

          replace_once(
              'src/audio-import-ui.js',
              "  const ASSET_VERSION = '4.4.0-fix1';",
              "  const ASSET_VERSION = document.documentElement.dataset.versione || 'dev';"
          )

          replace_once(
              'src/audio-import-ui.js',
              "    if (!importFrame.src) importFrame.src = `audio-import.html?v=${ASSET_VERSION}`;",
              "    if (!importFrame.src && !importFrame.srcdoc) {\n"
              "      const embedded = window.MANICO_AUDIO_IMPORT_SRCDOC;\n"
              "      if (embedded) importFrame.srcdoc = embedded;\n"
              "      else importFrame.src = `audio-import.html?v=${ASSET_VERSION}`;\n"
              "    }"
          )
          PY
      - name: Test
        run: npm test
      - name: Synchronize and build release
        run: npm run release
      - name: Check release consistency
        run: npm run check:release
      - name: Commit stabilization output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js src/canzoniere.js src/audio-import-ui.js \
            app.html index.html index.en.html audio-import.html \
            assets/app.bundle.js dist/manico.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Synchronize 4.4.1 release artifacts"
          git push
