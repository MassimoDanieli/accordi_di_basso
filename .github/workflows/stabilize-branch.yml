name: One-time branch stabilization

on:
  push:
    branches: [fix/stabilize-release-4.4.1]
    paths:
      - '.github/workflows/stabilize-branch.yml'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Test
        run: npm test
      - name: Synchronize and build release
        run: npm run release
      - name: Check release consistency
        run: npm run check:release
      - name: Verify Docker image
        run: docker build --tag manico-branch-ci .
      - name: Commit corrected artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html index.html index.en.html audio-import.html \
            assets/app.bundle.js dist/manico.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Rebuild corrected 4.4.1 artifacts"
          git push
