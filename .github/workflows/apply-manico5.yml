name: Apply Manico 5 payload

on:
  push:
    branches: [agent/manico-5-bass-transcriber]
    paths:
      - '.manico5-payload.tar.gz.b64'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Replace the legacy application
        run: |
          base64 --decode .manico5-payload.tar.gz.b64 > /tmp/manico5-payload.tar.gz
          tar --extract --gzip --file /tmp/manico5-payload.tar.gz
          rm -f .manico5-payload.tar.gz.b64
          rm -f audio-import.html
          rm -f src/audio-import-ui.js src/audio-transcriber.js
          rm -f src/theory.js src/voicings.js src/audio.js src/render.js src/tab.js
          rm -f src/forma.js src/ireal.js src/musicxml.js src/testo.js src/canzoniere.js
          rm -f src/library.js src/theme.js src/i18n.js
          rm -f .github/workflows/stabilize-branch.yml
          rm -f .github/workflows/apply-manico5.yml
          rm -f RELEASE_4.1.0.md
      - name: Test transcription engine
        run: npm test
      - name: Build synchronized release
        run: npm run release
      - name: Validate release
        run: npm run check:release
      - name: Commit Manico 5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild Manico as a bass transcriber"
          git push
