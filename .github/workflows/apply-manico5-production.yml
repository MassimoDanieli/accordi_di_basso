name: Apply Manico 5 production build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: manico5-production
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/manico-5-production' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify staged payload fragments
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/manico5-fragments.sha256 <<'EOF'
          c4bebee39ca8f7cf32b9c2a6150ceb41b0c4666cbff4faf301623df8c1823b8d  .manico5-part-00
          0db95df63104a8e4c2bd344f718828e86fd0ceb05f8ba430c9d1a772b153e925  .manico5-fix-01-0
          b91118f4227b478d433ee9304bffc1d332cd3ffede9d794c68a70d750e40dba6  .manico5-fix-01-1
          e29d2cedfd1ed82ee0f17648b46627da6a9399e938ad878c59f846f22fab23c8  .manico5-fix-01-2
          89d7c0ddbd9c37560655251cbb6e219662a00102b40de59a6499adc89ace46b8  .manico5-fix-01-3
          df80842970a9cfa0f31ef4010ccf7c9a7bd10a0fba33d17d6aec56a751ae09f5  .manico5-fix-02-0
          698f9ef03ec1339d21302a2ae6068757c909f8e28ffec3e6a254dfed2b883d4b  .manico5-fix-02-1
          813347819a306ca41cc1480cd8caae3bda34b84b8b64275bd3b21a13544821cc  .manico5-fix-02-2
          107fa700a8888587653b4135650a886d620df697b17da7a258ce69788a32c81d  .manico5-fix-02-3
          6c9a102b96b45753361052294b4445c7e54483c48fa83baa7935a84a525b1403  .manico5-part-03
          9bb4ac2e02a627d49258cc385d47aa61b471ac8f5fa3b72161a5a7961104a70b  .manico5-fix-04-0
          f41085eaa7efacf108f891fce7a94b8120d8cc05633367e487727690fb98dc14  .manico5-fix-04-1
          2718e311c482be17ce4897ccb836f9736f06f661fb569b20690ee839108355f1  .manico5-fix-04-2
          3722fa6959aeba8834986b87c6ada43b740b2ba7f507e9dd83e0eec6c50918c9  .manico5-fix-04-3-0
          cd30faeb32ffa757f3f757280235f4a7f18c85d4ac2b67036b355916040ea03b  .manico5-fix-04-3-1
          cec2697cafded15be1b36797444ecab9d3ad5c3afe1bf9bea8777281eaf21757  .manico5-fix-04-3-2
          86562994308fedfa7dddd04bfbd847306394b636bf3d45a2c0adcbbf2cb0c500  .manico5-part-05
          EOF
          sha256sum --check /tmp/manico5-fragments.sha256

          test "$(wc -c < .manico5-part-00)" -eq 12000
          test "$(wc -c < .manico5-part-03)" -eq 12000
          test "$(wc -c < .manico5-part-05)" -eq 10336

          for fragment in \
            .manico5-fix-01-0 .manico5-fix-01-1 .manico5-fix-01-2 .manico5-fix-01-3 \
            .manico5-fix-02-0 .manico5-fix-02-1 .manico5-fix-02-2 .manico5-fix-02-3 \
            .manico5-fix-04-0 .manico5-fix-04-1 .manico5-fix-04-2; do
            test "$(wc -c < "$fragment")" -eq 3000
          done
          for fragment in \
            .manico5-fix-04-3-0 .manico5-fix-04-3-1 .manico5-fix-04-3-2; do
            test "$(wc -c < "$fragment")" -eq 1000
          done

          cat \
            .manico5-part-00 \
            .manico5-fix-01-0 .manico5-fix-01-1 .manico5-fix-01-2 .manico5-fix-01-3 \
            .manico5-fix-02-0 .manico5-fix-02-1 .manico5-fix-02-2 .manico5-fix-02-3 \
            .manico5-part-03 \
            .manico5-fix-04-0 .manico5-fix-04-1 .manico5-fix-04-2 \
            .manico5-fix-04-3-0 .manico5-fix-04-3-1 .manico5-fix-04-3-2 \
            .manico5-part-05 \
            > /tmp/manico5-production.tar.gz.b64

          test "$(wc -c < /tmp/manico5-production.tar.gz.b64)" -eq 70336
          base64 --decode /tmp/manico5-production.tar.gz.b64 > /tmp/manico5-production.tar.gz
          echo "08db76b6203e16160bdf7616d8f737c22fdd32fc880b2b2533678670334a8550  /tmp/manico5-production.tar.gz" \
            | sha256sum --check
          tar --list --gzip --file /tmp/manico5-production.tar.gz > /tmp/manico5-files.txt
          test -s /tmp/manico5-files.txt

      - name: Replace legacy application with Manico 5
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name LICENSE \
            ! -name CNAME \
            -exec rm -rf {} +
          tar --extract --gzip --file /tmp/manico5-production.tar.gz --directory .

      - name: Test transcription engine
        run: npm test

      - name: Build synchronized release
        run: npm run release

      - name: Validate release
        run: npm run check:release

      - name: Verify Docker image
        run: docker build --tag manico5-ci .

      - name: Commit production rewrite
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild Manico as a bass transcriber"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
