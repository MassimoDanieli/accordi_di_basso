name: Finalize rectangular fretboard 5.1.1

on:
  push:
    branches: [agent/rectangular-fretboard-5.1.1]
    paths:
      - '.github/workflows/finalize-rectangular-511-push.yml'

permissions:
  contents: write

concurrency:
  group: finalize-rectangular-fretboard-511
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/rectangular-fretboard-5.1.1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Apply and validate final implementation
        run: bash .github/scripts/finalize-rectangular-511.sh
      - uses: actions/upload-artifact@v4
        with:
          name: manico-5.1.1-final-visual-review
          path: |
            visual-review-desktop.png
            visual-review-fretboard.png
            visual-review-mobile.png
          if-no-files-found: error
          retention-days: 7
      - name: Commit final implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/visual-review-511.yml
          rm -f .github/workflows/finalize-rectangular-511-push.yml
          rm -f .github/scripts/finalize-rectangular-511.sh
          rm -f visual-review-desktop.png visual-review-fretboard.png visual-review-mobile.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js assets/styles.css assets/app.bundle.js dist/manico.html \
            .github/workflows/visual-review-511.yml \
            .github/workflows/finalize-rectangular-511-push.yml \
            .github/scripts/finalize-rectangular-511.sh
          git commit -m "Polish rectangular fretboard layout"
          git push origin HEAD:agent/rectangular-fretboard-5.1.1
