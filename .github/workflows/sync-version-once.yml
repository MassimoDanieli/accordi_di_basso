name: Synchronize version 4.3.1 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-version-once.yml'

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update visible and cache versions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          version = "4.3.1"
          for filename in ("index.html", "index.en.html", "app.html"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              import re
              text = re.sub(r'data-versione="[0-9.]+"', f'data-versione="{version}"', text)
              text = re.sub(r'assets/styles\.css\?v=[0-9.]+', f'assets/styles.css?v={version}', text)
              text = re.sub(r'assets/app\.bundle\.js\?v=[0-9.]+', f'assets/app.bundle.js?v={version}', text)
              text = re.sub(r'src/audio-import-ui\.js\?v=[0-9.]+', f'src/audio-import-ui.js?v={version}', text)
              text = re.sub(r'<span class="ver">v[0-9.]+</span>', f'<span class="ver">v{version}</span>', text)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Commit synchronized pages
        run: |
          if git diff --quiet; then
            echo "Pages already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index.en.html app.html
          git commit -m "Synchronize published pages to 4.3.1"
          git push
