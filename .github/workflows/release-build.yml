name: Verify release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Test
        run: npm test
      - name: Rebuild release artifacts
        run: npm run release
      - name: Check release consistency
        run: npm run check:release
      - name: Reject stale generated files
        run: git diff --exit-code
      - name: Verify Docker image
        run: docker build --tag manico-ci .
