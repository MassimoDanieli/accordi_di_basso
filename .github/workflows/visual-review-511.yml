name: Visual review 5.1.1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  capture:
    if: github.head_ref == 'agent/rectangular-fretboard-5.1.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Capture source snapshot
        run: |
          tar --exclude=.git --exclude=node_modules --exclude='visual-review-*.png' -czf /tmp/source-snapshot.tar.gz .
          cp /tmp/source-snapshot.tar.gz source-snapshot.tar.gz
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install browser driver
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0
      - name: Start local site
        run: |
          npx --yes serve . -l 8080 > /tmp/manico-serve.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/manico-serve.log
          exit 1
      - name: Capture desktop and mobile studio
        shell: bash
        run: |
          cat > capture-visual-review.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const executablePath = [
            '/usr/bin/google-chrome',
            '/usr/bin/google-chrome-stable',
            '/usr/bin/chromium-browser',
            '/usr/bin/chromium'
          ].find(path => fs.existsSync(path));
          if (!executablePath) throw new Error('Chrome executable not found');

          const browser = await chromium.launch({ executablePath, headless: true, args: ['--no-sandbox'] });
          const page = await browser.newPage({ viewport: { width: 1440, height: 980 }, deviceScaleFactor: 1 });
          await page.goto('http://127.0.0.1:8080/', { waitUntil: 'networkidle' });
          await page.locator('#demoList .icon-button').first().click();
          await page.locator('#fretboard').waitFor({ state: 'visible' });
          await page.screenshot({ path: 'visual-review-desktop.png' });
          await page.locator('.instrument-stage').screenshot({ path: 'visual-review-fretboard.png' });

          await page.setViewportSize({ width: 390, height: 844 });
          await page.reload({ waitUntil: 'networkidle' });
          await page.locator('#demoList .icon-button').first().click();
          await page.locator('#fretboard').waitFor({ state: 'visible' });
          await page.screenshot({ path: 'visual-review-mobile.png' });
          await browser.close();
          JS
          node capture-visual-review.mjs
          rm -f capture-visual-review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: manico-5.1.1-visual-review
          path: |
            source-snapshot.tar.gz
            visual-review-desktop.png
            visual-review-fretboard.png
            visual-review-mobile.png
          if-no-files-found: error
          retention-days: 3
