<!DOCTYPE html>
<html lang="it" data-versione="2.6.1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manico</title>
<meta name="theme-color" content="#131110">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Fraunces:opsz,wght@9..144,600..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css?v=2.6.1">
<script>
  (function () {
    var t = 'scuro';
    try { var v = localStorage.getItem('manico-tema'); if (v === 'chiaro' || v === 'scuro') t = v; else
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'scuro' : 'chiaro';
    } catch (e) {}
    document.documentElement.setAttribute('data-tema', t);
  })();
</script>
</head>
<body class="app">

<header class="bar">
  <a class="brand" href="index.html" data-tt="bar.guide">
    <svg class="mark" viewBox="0 0 30 24" aria-hidden="true">
      <rect x="0.5" y="2.5" width="29" height="19" rx="3" class="mk-board"/>
      <line x1="4" y1="2.5" x2="4" y2="21.5" class="mk-nut"/>
      <line x1="12" y1="2.5" x2="12" y2="21.5" class="mk-fret"/>
      <line x1="20" y1="2.5" x2="20" y2="21.5" class="mk-fret"/>
      <line x1="0.5" y1="6.5" x2="29.5" y2="6.5" class="mk-string"/>
      <line x1="0.5" y1="11" x2="29.5" y2="11" class="mk-string"/>
      <line x1="0.5" y1="15.5" x2="29.5" y2="15.5" class="mk-string"/>
      <line x1="0.5" y1="20" x2="29.5" y2="20" class="mk-string"/>
      <circle cx="16" cy="11" r="3.2" class="mk-dot"/>
    </svg>
    <span class="word">Manico<b>.</b></span>
  </a>

  <input type="text" id="seq" value="C-7 F7 Bbdim7 Ebdim7" spellcheck="false" autocomplete="off"
         data-tt="bar.gridTitle" aria-label="chart">
  <button class="pri" id="go" data-t="bar.show">Mostra</button>

  <span class="sep"></span>
  <button class="pri play" id="pp">&#9654;</button>
  <span class="modes" id="modes"></span>
  <select id="beats" class="slim" data-tt="play.meter">
    <option value="4">4/4</option><option value="3">3/4</option><option value="2">2/4</option><option value="6">6/8</option>
  </select>
  <label class="tempo" data-tt="bar.tempo">
    <input type="range" id="bpm" min="40" max="200" step="1" value="92">
    <span class="val" id="bpmv">92</span>
  </label>

  <span class="grow"></span>

  <span class="flags">
    <button data-lang="it" title="Italiano" aria-label="Italiano"><span class="fl">🇮🇹</span></button>
    <button data-lang="en" title="English" aria-label="English"><span class="fl">🇬🇧</span></button>
  </span>
  <button id="tema" class="tog">Chiaro</button>
  <span class="ver">v2.6.1</span>
</header>

<main class="stage">
  <section class="left">
    <p class="songline" id="songline" hidden></p>
    <nav class="ribbon" id="chips"></nav>
    <div class="board" id="board"></div>
    <div class="zoneline">
      <label class="mini"><span class="cap" data-t="zone.from">Zona, dal tasto</span>
        <input type="range" id="zs" min="0" max="8" step="1" value="0"><span class="val" id="zsv">0</span></label>
      <label class="mini"><span class="cap" data-t="zone.width">ampiezza</span>
        <input type="range" id="zw" min="3" max="7" step="1" value="5"><span class="val" id="zwv">5</span></label>
      <span class="zdesc" id="zdesc"></span>
      <div class="strip" id="strip" data-tt="zone.coverageTitle"></div>
      <span class="key">
        <span><i style="background:var(--root)"></i><span data-t="key.root">fondamentale</span></span>
        <span><i style="background:var(--third)"></i><span data-t="key.third">terza</span></span>
        <span><i style="background:var(--fifth)"></i><span data-t="key.fifth">quinta</span></span>
        <span><i style="background:var(--sev)"></i><span data-t="key.sev">sesta e settima</span></span>
        <span><i style="background:var(--ext)"></i><span data-t="key.ext">estensioni</span></span>
      </span>
    </div>
  </section>

  <button class="vgrip" id="vtoggle" title="">
    <span class="vgrip-ch" aria-hidden="true">&#9656;</span>
    <span class="vgrip-txt" data-t="v.title">Voicing</span>
  </button>

  <aside class="vpanel">
    <div class="vhead">
      <h2><span data-t="v.title">Voicing</span> <small id="vcount"></small></h2>
      <div class="vrow">
        <select id="vtype"></select>
        <label class="mini" id="spanwrap"><span class="cap" data-t="v.span">apertura mano</span>
          <input type="range" id="span" min="3" max="6" step="1" value="4"><span class="val" id="spanv">4</span></label>
      </div>
      <div class="vrow">
        <button id="vl" data-t="v.lead">Ottimizza voice leading</button>
        <span class="val dim" id="vlinfo"></span>
      </div>
      <p class="hint" id="vhint"></p>
    </div>
    <div class="voices" id="voices"></div>
  </aside>
</main>

<nav class="tools">
  <button data-apre="dlgforme" data-t="bar.forms">Forme</button>
  <button data-apre="dlgireal" data-t="bar.ireal">iReal</button>
  <button data-apre="dlgtab" data-t="bar.tab">Tab</button>
  <button data-apre="dlgset" data-t="bar.settings">Impostazioni</button>
  <a href="index.html" data-t="bar.guide">Guida</a>
</nav>

<dialog id="dlgforme">
  <h2 data-t="lib.title">Forme armoniche</h2>
  <p class="hint" data-th="lib.hint"></p>
  <select id="lib" size="12"></select>
  <div class="dlg-foot"><span class="grow"></span>
    <button data-close data-t="close">Chiudi</button>
    <button class="pri" id="libgo" data-t="lib.load">Carica</button></div>
</dialog>

<dialog id="dlgireal">
  <h2 data-t="ir.title">Importa da iReal Pro</h2>
  <p class="hint" data-th="ir.hint"></p>
  <textarea id="ireal" spellcheck="false" placeholder="irealb://..."></textarea>
  <select id="irlist" style="display:none;margin-top:10px"></select>
  <p class="hint" id="irinfo"></p>
  <div class="dlg-foot"><span class="grow"></span>
    <button data-close data-t="close">Chiudi</button>
    <button class="pri" id="irgo" data-t="ir.go">Importa</button></div>
</dialog>

<dialog id="dlgtab" class="wide">
  <h2 data-t="tab.title">Tab ASCII</h2>
  <p class="hint" data-th="tab.hint"></p>
  <pre id="tab"></pre>
  <div class="dlg-foot">
    <select id="tabmode"></select>
    <select id="perline"><option value="4">4</option><option value="2">2</option><option value="6">6</option></select>
    <span class="grow"></span>
    <button data-close data-t="close">Chiudi</button>
    <button id="dltab" data-t="tab.dl">Scarica</button>
    <button id="cptab" data-t="tab.copy">Copia</button>
    <button class="pri" id="mktab" data-t="tab.make">Genera</button>
  </div>
</dialog>

<dialog id="dlgset">
  <h2 data-t="set.title">Strumento e vista</h2>
  <label class="field"><span data-t="set.bass">Basso</span><select id="tun"></select></label>
  <label class="field"><span data-t="set.frets">Tasti mostrati</span><select id="nfrets"></select></label>
  <div class="field"><span data-t="set.notes">Note sul manico</span>
    <div class="togs">
      <button class="tog on" id="tlab">Gradi</button>
      <button class="tog" id="tflip" data-t="set.flip">Inverti corde</button>
      <button class="tog on" id="tdim" data-t="set.dim">Sfuma fuori zona</button>
    </div>
  </div>
  <p class="hint" data-th="set.viewHint"></p>

  <h2 style="margin-top:22px" data-t="play.title">Esecuzione</h2>
  <div class="field"><span data-t="play.options">Opzioni</span>
    <div class="togs">
      <button class="tog on" id="clk" data-t="play.click">Click</button>
      <button class="tog" id="lock" data-t="play.lock">Zona fissa</button>
    </div>
  </div>
  <p class="hint" data-th="play.hint"></p>
  <p class="hint" data-th="foot"></p>
  <div class="dlg-foot"><span class="grow"></span><button class="pri" data-close data-t="close">Chiudi</button></div>
</dialog>

<script src="assets/app.bundle.js?v=2.6.1"></script>
</body>
</html>
