<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MP3 → linea di basso</title>
<style>
:root{color-scheme:dark;--bg:#171411;--line:#443a32;--ink:#f5eee7;--dim:#ab9e91;--gold:#e9b04a;--note:#78b89a;--ctx:#789be8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif}.wrap{padding:14px}.drop{padding:18px;text-align:center;border:1px dashed #6d5c4e;border-radius:10px;background:#ffffff08}.drop.over{border-color:var(--gold)}button,.filebtn,input,select,textarea{font:inherit}.filebtn,button{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#302923;color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}.pri{background:var(--gold);border-color:var(--gold);color:#21180b;font-weight:800}.filebtn input{display:none}.muted{color:var(--dim)}[hidden]{display:none!important}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}.wave{position:relative;height:105px;margin:12px 0;border:1px solid var(--line);border-radius:8px;background:#0d0c0b;overflow:hidden;cursor:crosshair}.wave canvas{display:block;width:100%;height:100%}.head{position:absolute;top:0;bottom:0;width:2px;background:var(--gold)}input[type=range]{accent-color:var(--gold)}#seek{flex:1;min-width:150px}.progress{height:5px;min-width:100px;flex:1;background:#302923;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--gold)}.timeline{display:flex;gap:6px;overflow:auto;margin:10px 0;padding-bottom:5px}.event{min-width:106px;border:1px solid var(--line);border-radius:8px;padding:8px;background:#29231f}.event.on{border-color:var(--gold)}.event input{width:76px;background:#120f0d;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:4px}.event small{display:block;color:var(--dim);margin-top:4px}.title{font-weight:800;margin:13px 0 6px}.warning{color:#d8b372;font-size:12px}.status{color:var(--dim)}.current{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}.metric{border:1px solid var(--line);border-radius:8px;padding:9px;background:#ffffff05}.metric b{display:block;font-size:20px;color:var(--gold)}.boardbox{overflow:auto}.board{display:grid;grid-template-columns:34px repeat(13,1fr);grid-template-rows:repeat(4,38px);background:linear-gradient(#5b3824,#402719);border:1px solid #76513a;border-radius:8px;overflow:hidden;min-width:680px}.cell{position:relative;border-right:1px solid #b78b6a66;border-bottom:1px solid #dbc4ae44}.lab{display:flex;align-items:center;justify-content:center;background:#181512;font-weight:700}.dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#17110b;font-size:9px;font-weight:900;background:var(--note);box-shadow:0 0 0 3px #78b89a33}.ctx{position:absolute;right:2px;bottom:2px;width:6px;height:6px;border-radius:50%;background:var(--ctx)}.outputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.outputs textarea{width:100%;min-height:120px;background:#100e0c;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px;font-family:ui-monospace,monospace}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}@media(max-width:720px){.outputs{grid-template-columns:1fr}.current{grid-template-columns:1fr}.board{min-width:650px}}
</style>
</head>
<body><div class="wrap">
<div id="drop" class="drop"><strong data-k="chooseTitle"></strong><p class="muted" data-k="privacy"></p><label class="filebtn pri"><span data-k="choose"></span><input id="file" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac"></label></div>
<section id="work" hidden><div class="row"><b id="name"></b><span id="dur" class="muted"></span><span class="grow"></span><span id="status" class="status"></span></div><div id="wave" class="wave"><canvas id="canvas"></canvas><div id="head" class="head"></div></div><div class="row"><button id="play" class="pri">▶</button><button id="back">−5s</button><button id="fwd">+5s</button><input id="seek" type="range" min="0" max="1000" value="0"><span id="clock" class="muted"></span></div><div class="row" style="margin-top:10px"><label><span data-k="sensitivity"></span> <input id="sensitivity" type="range" min="55" max="90" value="72"></label><button id="analyse" class="pri" data-k="analyse"></button><div class="progress"><i id="prog"></i></div><span class="warning" data-k="warning"></span></div></section>
<section id="results" hidden>
<div class="current"><div class="metric"><span data-k="currentNote"></span><b id="currentNote">—</b></div><div class="metric"><span data-k="position"></span><b id="position">—</b></div><div class="metric"><span data-k="context"></span><b id="context">—</b></div></div>
<div class="title" data-k="timeline"></div><div id="timeline" class="timeline"></div>
<div class="title" data-k="fretboard"></div><div class="boardbox"><div id="board" class="board"></div></div>
<div class="outputs"><label><span data-k="notes"></span><textarea id="notes"></textarea></label><label><span data-k="tab"></span><textarea id="tab"></textarea></label></div>
<div class="buttons"><button id="copy" data-k="copy"></button><button id="download" data-k="download"></button><button id="close" class="pri" data-k="close"></button></div>
</section></div><audio id="audio"></audio>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const L={it:{chooseTitle:'Importa una registrazione e ricava la linea di basso',privacy:'Il file resta nel browser. Manico cerca attacchi, note gravi, ritmo e diteggiatura.',choose:'Scegli audio',sensitivity:'Sensibilità',analyse:'Trascrivi linea di basso',warning:'È una stima: correggi note e ritmo a orecchio.',currentNote:'Nota reale',position:'Posizione',context:'Accordo probabile',timeline:'Linea rilevata — clicca per ascoltare, modifica la nota se serve',fretboard:'Tastiera sincronizzata',notes:'Sequenza temporale',tab:'TAB suggerita',copy:'Copia TAB',download:'Scarica .txt',close:'Usa questa linea',decoding:'Decodifica…',ready:'Pronto per la trascrizione',running:'Rilevamento della linea di basso…',done:'Linea pronta da controllare',bad:'Formato audio non leggibile',copied:'Copiata'},en:{chooseTitle:'Import a recording and extract the bass line',privacy:'The file stays in your browser. Manico looks for attacks, low notes, rhythm and fingering.',choose:'Choose audio',sensitivity:'Sensitivity',analyse:'Transcribe bass line',warning:'This is an estimate: check notes and rhythm by ear.',currentNote:'Played note',position:'Position',context:'Likely chord',timeline:'Detected line — click to listen, edit the note when needed',fretboard:'Synchronized fretboard',notes:'Timed sequence',tab:'Suggested TAB',copy:'Copy TAB',download:'Download .txt',close:'Use this line',decoding:'Decoding…',ready:'Ready to transcribe',running:'Detecting the bass line…',done:'Line ready for review',bad:'Unsupported audio format',copied:'Copied'}};let lang='it';try{lang=localStorage.getItem('manico-lingua')==='en'?'en':'it'}catch(e){}document.documentElement.lang=lang;document.querySelectorAll('[data-k]').forEach(x=>x.textContent=L[lang][x.dataset.k]);
const audio=$('audio'),file=$('file'),drop=$('drop'),canvas=$('canvas'),ctx=canvas.getContext('2d');let url=null,buf=null,events=[],raf=0,current=-1;const N=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'],OPEN=[40,45,50,55],CHORDS=[['',[0,4,7]],['m',[0,3,7]],['7',[0,4,7,10]],['m7',[0,3,7,10]],['maj7',[0,4,7,11]]];const fmt=s=>{s=Number.isFinite(s)?s:0;return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')};const noteName=m=>N[(m%12+12)%12]+(Math.floor(m/12)-1);
function draw(){const d=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#0d0c0b';ctx.fillRect(0,0,w,h);if(!buf)return;const a=buf.getChannelData(0),step=Math.max(1,Math.ceil(a.length/w)),mid=h/2;ctx.strokeStyle='#e9b04a';ctx.beginPath();for(let x=0;x<w;x++){let lo=1,hi=-1;for(let i=x*step;i<Math.min(a.length,(x+1)*step);i++){lo=Math.min(lo,a[i]);hi=Math.max(hi,a[i])}ctx.moveTo(x,mid+lo*mid*.82);ctx.lineTo(x,mid+hi*mid*.82)}ctx.stroke();if(events.length){ctx.fillStyle='#78b89a';for(const e of events){const x=e.start/buf.duration*w;ctx.fillRect(x,0,1,h)}}}
async function load(f){if(!f)return;audio.pause();if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);audio.src=url;$('name').textContent=f.name;$('work').hidden=false;$('results').hidden=true;$('status').textContent=L[lang].decoding;try{const ac=new(window.AudioContext||window.webkitAudioContext)();buf=await ac.decodeAudioData((await f.arrayBuffer()).slice(0));await ac.close();draw();$('dur').textContent=fmt(buf.duration);$('status').textContent=L[lang].ready}catch(e){buf=null;$('status').textContent=L[lang].bad}}
function mono(){const n=buf.length,o=new Float32Array(n);for(let c=0;c<buf.numberOfChannels;c++){const a=buf.getChannelData(c);for(let i=0;i<n;i++)o[i]+=a[i]/buf.numberOfChannels}return o}
function lowpass(a,sr,cut=330){const o=new Float32Array(a.length),alpha=1-Math.exp(-2*Math.PI*cut/sr);let y=0;for(let i=0;i<a.length;i++){y+=alpha*(a[i]-y);o[i]=y}return o}
function rms(a,start,len){let s=0;for(let i=0;i<len&&start+i<a.length;i++){const v=a[start+i];s+=v*v}return Math.sqrt(s/len)}
function detectOnsets(a,sr){const hop=Math.max(1,Math.round(sr*.012)),win=Math.round(sr*.035),energy=[];for(let p=0;p+win<a.length;p+=hop)energy.push(rms(a,p,win));const sorted=[...energy].sort((x,y)=>x-y),floor=sorted[Math.floor(sorted.length*.35)]||0,peak=sorted[Math.floor(sorted.length*.92)]||1,sens=+$('sensitivity').value/100,threshold=floor+(peak-floor)*(1-sens)*.9;const out=[];let last=-999;for(let i=2;i<energy.length-2;i++){const flux=energy[i]-Math.max(energy[i-1],energy[i-2]);if(energy[i]>threshold&&flux>threshold*.22&&i-last>Math.round(.065*sr/hop)){out.push(i*hop/sr);last=i}}if(!out.length||out[0]>.12)out.unshift(0);return out}
function yin(a,sr,start){const size=Math.min(Math.round(sr*.12),8192),x=new Float32Array(size);for(let i=0;i<size;i++)x[i]=a[Math.min(a.length-1,start+i)]||0;let mean=0;for(const v of x)mean+=v;mean/=x.length;for(let i=0;i<x.length;i++)x[i]-=mean;const minLag=Math.floor(sr/330),maxLag=Math.min(Math.floor(sr/35),size/2),d=new Float32Array(maxLag+1),cm=new Float32Array(maxLag+1);for(let tau=1;tau<=maxLag;tau++){let s=0;for(let i=0;i<size-tau;i++){const q=x[i]-x[i+tau];s+=q*q}d[tau]=s}let run=0;cm[0]=1;for(let tau=1;tau<=maxLag;tau++){run+=d[tau];cm[tau]=run?d[tau]*tau/run:1}let lag=-1;for(let tau=minLag;tau<maxLag;tau++){if(cm[tau]<.18&&cm[tau]<=cm[tau+1]){lag=tau;break}}if(lag<0){let best=1;for(let tau=minLag;tau<=maxLag;tau++)if(cm[tau]<best){best=cm[tau];lag=tau}}if(lag<0||cm[lag]>.42)return null;const freq=sr/lag,midi=Math.round(69+12*Math.log2(freq/440));if(midi<28||midi>67)return null;return{midi,conf:Math.max(0,1-cm[lag]),freq}}
function chordAt(a,sr,time){const start=Math.max(0,Math.floor((time-.25)*sr)),len=Math.min(Math.floor(sr*.7),a.length-start),ch=Array(12).fill(0);for(let m=36;m<=72;m++){const f=440*Math.pow(2,(m-69)/12),w=2*Math.PI*f/sr,co=2*Math.cos(w);let x=0,y=0,z=0;for(let i=0;i<len;i++){x=a[start+i]+co*y-z;z=y;y=x}ch[m%12]+=Math.sqrt(Math.max(0,y*y+z*z-co*y*z))}const sum=ch.reduce((s,v)=>s+v,0)||1;for(let i=0;i<12;i++)ch[i]/=sum;let best={score:-9,name:'—',pcs:[]};for(let r=0;r<12;r++)for(const [s,int]of CHORDS){const pcs=int.map(v=>(r+v)%12),inside=pcs.reduce((q,p)=>q+ch[p],0),outside=ch.reduce((q,v,p)=>q+(pcs.includes(p)?0:v),0),score=inside-outside*.38+ch[r]*.12;if(score>best.score)best={score,name:N[r]+s,pcs}}return best}
function positions(midi){const out=[];OPEN.forEach((o,string)=>{const fret=midi-o;if(fret>=0&&fret<=12)out.push({string,fret})});return out}
function choosePositions(){let prev=null;for(const e of events){const cand=positions(e.midi);if(!cand.length){e.pos=null;continue}cand.sort((a,b)=>{const ca=(prev?Math.abs(a.fret-prev.fret)*2+Math.abs(a.string-prev.string)*3:a.fret)+a.fret*.08;const cb=(prev?Math.abs(b.fret-prev.fret)*2+Math.abs(b.string-prev.string)*3:b.fret)+b.fret*.08;return ca-cb});e.pos=cand[0];prev=e.pos}}
async function analyse(){if(!buf)return;$('analyse').disabled=true;$('status').textContent=L[lang].running;$('prog').style.width='0%';const raw=mono(),a=lowpass(raw,buf.sampleRate),onsets=detectOnsets(a,buf.sampleRate);events=[];for(let i=0;i<onsets.length;i++){const start=onsets[i],end=i+1<onsets.length?onsets[i+1]:Math.min(buf.duration,start+.8),p=yin(a,buf.sampleRate,Math.floor((start+.025)*buf.sampleRate));if(p){const ctx=chordAt(raw,buf.sampleRate,start+.12);events.push({start,end,dur:Math.max(.06,end-start),midi:p.midi,conf:p.conf,chord:ctx.name,pcs:ctx.pcs})}$('prog').style.width=((i+1)/onsets.length*100)+'%';if(i%4===0)await new Promise(r=>setTimeout(r,0))}events=events.filter((e,i)=>i===0||e.start-events[i-1].start>.045);for(let i=0;i<events.length;i++)events[i].end=i+1<events.length?events[i+1].start:Math.min(buf.duration,events[i].start+events[i].dur);choosePositions();render();draw();$('results').hidden=false;$('status').textContent=L[lang].done;$('analyse').disabled=false;current=-1;show(audio.currentTime)}
function parseEdited(s){const m=s.trim().match(/^([A-G])([b#]?)(-?\d)$/);if(!m)return null;let pc={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);return(pc+12)%12+(+m[3]+1)*12}
function render(){const box=$('timeline');box.innerHTML='';events.forEach((e,i)=>{const d=document.createElement('div');d.className='event';d.dataset.i=i;d.innerHTML=`<input value="${noteName(e.midi)}"><small>${fmt(e.start)} · ${(e.end-e.start).toFixed(2)}s · ${Math.round(e.conf*100)}%</small><small>${e.chord}</small>`;d.onclick=x=>{if(x.target.tagName!=='INPUT')audio.currentTime=e.start};d.querySelector('input').onchange=x=>{const m=parseEdited(x.target.value);if(m!==null){e.midi=m;choosePositions();buildOutputs();current=-1;show(audio.currentTime)}else x.target.value=noteName(e.midi)};box.appendChild(d)});buildOutputs()}
function buildOutputs(){const seq=events.map(e=>`${e.start.toFixed(2)}\t${noteName(e.midi)}\t${(e.end-e.start).toFixed(2)}s\t${e.pos?'S'+(4-e.pos.string)+' F'+e.pos.fret:'?'}`).join('\n');$('notes').value=seq;const strings=['G','D','A','E'],cols=events.map(e=>e.pos?String(e.pos.fret):'x'),widths=cols.map(x=>Math.max(3,x.length+1));let tab='';for(let s=0;s<4;s++){tab+=strings[s]+'|';events.forEach((e,i)=>{const v=e.pos&&e.pos.string===3-s?String(e.pos.fret):'-';tab+=v.padEnd(widths[i],'-')+'|'});tab+='\n'}$('tab').value=tab}
function board(e){const b=$('board');b.innerHTML='';for(let s=0;s<4;s++){const l=document.createElement('div');l.className='lab';l.textContent=['E','A','D','G'][s];b.appendChild(l);for(let f=0;f<=12;f++){const c=document.createElement('div');c.className='cell';if(e&&e.pos&&e.pos.string===s&&e.pos.fret===f){const d=document.createElement('span');d.className='dot';d.textContent=noteName(e.midi);c.appendChild(d)}if(e&&e.pcs&&e.pcs.includes((OPEN[s]+f)%12)){const q=document.createElement('i');q.className='ctx';c.appendChild(q)}b.appendChild(c)}}}
function show(t){if(!events.length)return;let i=events.findIndex(e=>t>=e.start&&t<e.end);if(i<0)i=Math.max(0,events.findLastIndex(e=>e.start<=t));if(i===current)return;current=i;document.querySelectorAll('.event').forEach((x,k)=>x.classList.toggle('on',k===i));const e=events[i];$('currentNote').textContent=noteName(e.midi);$('position').textContent=e.pos?['E','A','D','G'][e.pos.string]+' · '+e.pos.fret:'—';$('context').textContent=e.chord||'—';board(e);document.querySelector(`.event[data-i="${i}"]`)?.scrollIntoView({block:'nearest',inline:'center'})}
function tick(){const t=audio.currentTime||0,d=audio.duration||0;$('seek').value=d?t/d*1000:0;$('clock').textContent=fmt(t)+' / '+fmt(d);$('head').style.left=(d?t/d*100:0)+'%';show(t);raf=requestAnimationFrame(tick)}
file.onchange=()=>load(file.files[0]);['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('over')}));['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('over')}));drop.ondrop=e=>load([...e.dataTransfer.files][0]);$('analyse').onclick=analyse;$('play').onclick=()=>audio.paused?audio.play():audio.pause();audio.onloadedmetadata=tick;$('seek').oninput=e=>audio.currentTime=e.target.value/1000*(audio.duration||0);$('wave').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*(audio.duration||0)};$('back').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-5);$('fwd').onclick=()=>audio.currentTime=Math.min(audio.duration||0,audio.currentTime+5);$('copy').onclick=()=>navigator.clipboard?.writeText($('tab').value).then(()=>{$('copy').textContent=L[lang].copied;setTimeout(()=>$('copy').textContent=L[lang].copy,1000)});$('download').onclick=()=>{const blob=new Blob([$('tab').value+'\n\n'+$('notes').value],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(($('name').textContent||'bass-line').replace(/\.[^.]+$/,''))+'-bass-tab.txt';a.click();URL.revokeObjectURL(a.href)};$('close').onclick=()=>{parent.postMessage({type:'manico-bassline',title:($('name').textContent||'Audio').replace(/\.[^.]+$/,''),events:events.map(e=>({start:e.start,end:e.end,midi:e.midi,note:noteName(e.midi),string:e.pos?e.pos.string:null,fret:e.pos?e.pos.fret:null,chord:e.chord})),tab:$('tab').value},location.origin)};addEventListener('resize',draw);addEventListener('beforeunload',()=>{cancelAnimationFrame(raf);if(url)URL.revokeObjectURL(url)});board(null)})();
</script></body></html>
