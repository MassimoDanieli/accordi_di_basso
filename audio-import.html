<!doctype html>
<html lang="it" data-versione="4.4.1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MP3 → Manico</title>
<style>
:root{color-scheme:dark;--bg:#171411;--panel:#211d19;--line:#443a32;--ink:#f5eee7;--dim:#ab9e91;--gold:#e9b04a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#2b2119,transparent 42%),var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif;min-height:100vh}.shell{width:min(780px,calc(100% - 28px));margin:0 auto;padding:38px 0}.hero{text-align:center;margin-bottom:20px}.hero h1{font-size:clamp(32px,6vw,60px);line-height:1;margin:0 0 12px;letter-spacing:-.04em}.hero p{color:var(--dim);max-width:650px;margin:0 auto}.card{border:1px solid var(--line);border-radius:16px;background:#ffffff08;box-shadow:0 20px 60px #0005;padding:20px}.drop{padding:28px;border:1px dashed #6d5c4e;border-radius:12px;text-align:center;background:#0002}.filebtn,button,input{font:inherit}.filebtn,button{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#302923;color:var(--ink);border-radius:9px;padding:10px 14px;cursor:pointer}.filebtn{background:var(--gold);border-color:var(--gold);color:#21180b;font-weight:800}.filebtn input{display:none}.details{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}.details .grow{flex:1}.muted{color:var(--dim)}.progress{height:7px;background:#302923;border-radius:10px;overflow:hidden;margin-top:14px}.progress i{display:block;width:0;height:100%;background:var(--gold);transition:width .12s linear}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}.actions button{background:var(--gold);border-color:var(--gold);color:#21180b;font-weight:800}.actions button:disabled{opacity:.45;cursor:not-allowed}.warning{color:#d8b372;font-size:13px;margin:14px 0 0}.status{color:var(--dim);font-variant-numeric:tabular-nums}@media(max-width:600px){.shell{padding-top:18px}.card{padding:14px}.details{align-items:flex-start}}
</style>
</head>
<body>
<main class="shell">
  <section class="hero">
    <h1 data-copy="chooseTitle"></h1>
    <p data-copy="privacy"></p>
  </section>
  <section class="card">
    <div class="drop">
      <label class="filebtn"><span data-copy="choose"></span><input id="file" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac"></label>
    </div>
    <div class="details">
      <strong id="fileName">—</strong>
      <span id="duration" class="muted"></span>
      <span class="grow"></span>
      <label><span data-copy="sensitivity"></span> <input id="sensitivity" type="range" min="55" max="90" value="72"></label>
    </div>
    <div class="progress"><i id="progressBar"></i></div>
    <div class="actions">
      <button id="importButton" type="button" disabled data-copy="import"></button>
      <span id="status" class="status"></span>
    </div>
    <p class="warning" data-copy="warning"></p>
  </section>
</main>
<script src="src/audio-transcriber.js?v=4.4.1"></script>
</body>
</html>
