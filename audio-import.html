<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MP3 → Manico</title>
<style>
:root{color-scheme:dark;--bg:#171411;--panel:#211d19;--line:#443a32;--ink:#f5eee7;--dim:#ab9e91;--gold:#e9b04a;--root:#f0c75e;--third:#e87d68;--fifth:#74b79c;--sev:#789be8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif}.wrap{padding:14px}.drop{padding:18px;text-align:center;border:1px dashed #6d5c4e;border-radius:10px;background:#ffffff08}.drop.over{border-color:var(--gold)}button,.filebtn,input,select{font:inherit}.filebtn,button{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#302923;color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}.pri{background:var(--gold);border-color:var(--gold);color:#21180b;font-weight:800}.filebtn input{display:none}.muted{color:var(--dim)}[hidden]{display:none!important}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}.wave{position:relative;height:100px;margin:12px 0;border:1px solid var(--line);border-radius:8px;background:#0d0c0b;overflow:hidden;cursor:crosshair}.wave canvas{display:block;width:100%;height:100%}.head{position:absolute;top:0;bottom:0;width:2px;background:var(--gold)}input[type=range]{accent-color:var(--gold)}#seek{flex:1;min-width:150px}.progress{height:5px;min-width:100px;flex:1;background:#302923;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--gold)}.segments{display:flex;gap:6px;overflow:auto;margin:12px 0;padding-bottom:4px}.seg{min-width:92px;border:1px solid var(--line);border-radius:8px;padding:8px;background:#29231f}.seg.on{border-color:var(--gold)}.seg input{width:72px;background:#120f0d;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:4px}.seg small{display:block;color:var(--dim);margin-top:4px}.result{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.result textarea{width:100%;min-height:64px;background:#100e0c;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px}.board{display:grid;grid-template-columns:32px repeat(13,1fr);grid-template-rows:repeat(4,34px);margin-top:12px;background:linear-gradient(#5b3824,#402719);border:1px solid #76513a;border-radius:8px;overflow:hidden;min-width:650px}.boardbox{overflow:auto}.cell{position:relative;border-right:1px solid #b78b6a66;border-bottom:1px solid #dbc4ae44}.lab{display:flex;align-items:center;justify-content:center;background:#181512;font-weight:700}.dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#17110b;font-size:9px;font-weight:900}.root{background:var(--root)}.third{background:var(--third)}.fifth{background:var(--fifth)}.sev{background:var(--sev)}.title{font-weight:800;margin:12px 0 6px}.warning{color:#d8b372;font-size:12px}.status{color:var(--dim)}
</style>
</head>
<body><div class="wrap">
<div id="drop" class="drop"><strong data-k="chooseTitle"></strong><p class="muted" data-k="privacy"></p><label class="filebtn pri"><span data-k="choose"></span><input id="file" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac"></label></div>
<section id="work" hidden><div class="row"><b id="name"></b><span id="dur" class="muted"></span><span class="grow"></span><span id="status" class="status"></span></div><div id="wave" class="wave"><canvas id="canvas"></canvas><div id="head" class="head"></div></div><div class="row"><button id="play" class="pri">▶</button><button id="back">−5s</button><button id="fwd">+5s</button><input id="seek" type="range" min="0" max="1000" value="0"><span id="clock" class="muted"></span></div><div class="row" style="margin-top:10px"><label><span data-k="window"></span> <select id="window"><option value="1.5">1.5 s</option><option value="2" selected>2 s</option><option value="3">3 s</option><option value="4">4 s</option></select></label><button id="analyse" class="pri" data-k="analyse"></button><div class="progress"><i id="prog"></i></div><span class="warning" data-k="warning"></span></div></section>
<section id="results" hidden><div class="title" data-k="timeline"></div><div id="segments" class="segments"></div><div class="boardbox"><div id="board" class="board"></div></div><div class="result"><label><span data-k="grid"></span><textarea id="grid"></textarea></label><button id="send" class="pri" data-k="send"></button></div></section>
</div><audio id="audio"></audio>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const L={it:{chooseTitle:'Importa una registrazione',privacy:'MP3, WAV o M4A. Il file resta nel browser.',choose:'Scegli audio',window:'Finestra',analyse:'Analizza accordi',warning:'La stima va controllata e corretta.',timeline:'Accordi rilevati — clicca e correggi',grid:'Griglia da importare',send:'Importa in Manico',decoding:'Decodifica…',ready:'Pronto per l’analisi',running:'Analisi armonica…',done:'Analisi completata',bad:'Formato non leggibile'},en:{chooseTitle:'Import a recording',privacy:'MP3, WAV or M4A. The file stays in your browser.',choose:'Choose audio',window:'Window',analyse:'Analyse chords',warning:'Review and correct the estimate.',timeline:'Detected chords — click and correct',grid:'Chart to import',send:'Import into Manico',decoding:'Decoding…',ready:'Ready to analyse',running:'Harmonic analysis…',done:'Analysis complete',bad:'Unsupported audio format'}};let lang='it';try{lang=localStorage.getItem('manico-lingua')==='en'?'en':'it'}catch(e){}document.documentElement.lang=lang;document.querySelectorAll('[data-k]').forEach(x=>x.textContent=L[lang][x.dataset.k]);const audio=$('audio'),file=$('file'),drop=$('drop'),canvas=$('canvas'),ctx=canvas.getContext('2d');let url=null,buf=null,segments=[],raf=0,current=-1;const N=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'],OPEN=[4,9,2,7],T=[['',[0,4,7]],['m',[0,3,7]],['7',[0,4,7,10]],['maj7',[0,4,7,11]],['m7',[0,3,7,10]],['sus4',[0,5,7]],['sus2',[0,2,7]]];const fmt=s=>{s=Number.isFinite(s)?s:0;return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')};function draw(){const d=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#0d0c0b';ctx.fillRect(0,0,w,h);if(!buf)return;const a=buf.getChannelData(0),step=Math.max(1,Math.ceil(a.length/w)),mid=h/2;ctx.strokeStyle='#e9b04a';ctx.beginPath();for(let x=0;x<w;x++){let lo=1,hi=-1;for(let i=x*step;i<Math.min(a.length,(x+1)*step);i++){lo=Math.min(lo,a[i]);hi=Math.max(hi,a[i])}ctx.moveTo(x,mid+lo*mid*.82);ctx.lineTo(x,mid+hi*mid*.82)}ctx.stroke()}async function load(f){if(!f)return;audio.pause();if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);audio.src=url;$('name').textContent=f.name;$('work').hidden=false;$('results').hidden=true;$('status').textContent=L[lang].decoding;try{const ac=new(window.AudioContext||window.webkitAudioContext)();buf=await ac.decodeAudioData((await f.arrayBuffer()).slice(0));await ac.close();draw();$('dur').textContent=fmt(buf.duration);$('status').textContent=L[lang].ready}catch(e){buf=null;$('status').textContent=L[lang].bad}}function mono(start,len){const o=new Float32Array(len);for(let c=0;c<buf.numberOfChannels;c++){const a=buf.getChannelData(c);for(let i=0;i<len&&start+i<a.length;i++)o[i]+=a[start+i]/buf.numberOfChannels}return o}function go(a,sr,f){const w=2*Math.PI*f/sr,co=2*Math.cos(w);let x=0,y=0,z=0;for(let i=0;i<a.length;i++){const win=.5-.5*Math.cos(2*Math.PI*i/(a.length-1));x=a[i]*win+co*y-z;z=y;y=x}return Math.max(0,y*y+z*z-co*y*z)}function chroma(a,sr){const c=Array(12).fill(0);for(let m=36;m<=83;m++)c[m%12]+=Math.sqrt(go(a,sr,440*Math.pow(2,(m-69)/12)));const sum=c.reduce((x,y)=>x+y,0)||1;return c.map(x=>x/sum)}function detect(c){let b={score:-1,name:'N.C.',pcs:[],conf:0};for(let r=0;r<12;r++)for(const [s,int]of T){const pcs=int.map(i=>(r+i)%12),inside=pcs.reduce((x,p)=>x+c[p],0),outside=c.reduce((x,v,p)=>x+(pcs.includes(p)?0:v),0),score=inside-outside*.48+c[r]*.16;if(score>b.score)b={score,name:N[r]+s,pcs,conf:Math.max(0,Math.min(1,(inside-outside*.35)*1.4))}}return b.conf<.18?{name:'N.C.',pcs:[],conf:b.conf}:b}async function analyse(){if(!buf)return;$('analyse').disabled=true;$('status').textContent=L[lang].running;segments=[];const sec=+$('window').value,sr=buf.sampleRate,len=Math.min(16384,2**Math.floor(Math.log2(sr*.35))),count=Math.ceil(buf.duration/sec);for(let n=0;n<count;n++){const start=Math.max(0,Math.floor((n+.5)*sec*sr-len/2)),d=detect(chroma(mono(start,len),sr));segments.push({start:n*sec,end:Math.min(buf.duration,(n+1)*sec),name:d.name,pcs:d.pcs,conf:d.conf});$('prog').style.width=((n+1)/count*100)+'%';if(n%3===0)await new Promise(r=>setTimeout(r,0))}for(let i=1;i<segments.length-1;i++)if(segments[i-1].name===segments[i+1].name&&segments[i].conf<.42)segments[i]={...segments[i],name:segments[i-1].name,pcs:segments[i-1].pcs};segments=segments.filter((s,i)=>i===0||s.name!==segments[i-1].name).map((s,i,a)=>({...s,end:i<a.length-1?a[i+1].start:buf.duration}));render();$('results').hidden=false;$('status').textContent=L[lang].done;$('analyse').disabled=false;show(audio.currentTime)}function pcs(name){if(name==='N.C.')return[];const m=name.match(/^([A-G])([b#]?)(.*)$/);if(!m)return[];let r={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);r=(r+12)%12;const t=T.find(x=>x[0]===m[3])||T[0];return t[1].map(i=>(r+i)%12)}function rebuild(){const a=[];for(const s of segments)if(!a.length||a.at(-1)!==s.name)a.push(s.name);$('grid').value=a.join(' ')}function render(){const box=$('segments');box.innerHTML='';segments.forEach((s,i)=>{const e=document.createElement('div');e.className='seg';e.dataset.i=i;e.innerHTML=`<input value="${s.name}"><small>${fmt(s.start)}–${fmt(s.end)} · ${Math.round(s.conf*100)}%</small>`;e.onclick=x=>{if(x.target.tagName!=='INPUT')audio.currentTime=s.start};e.querySelector('input').onchange=x=>{s.name=x.target.value.trim()||'N.C.';s.pcs=pcs(s.name);rebuild();current=-1;show(audio.currentTime)};box.appendChild(e)});rebuild()}function board(p){const b=$('board');b.innerHTML='';for(let s=0;s<4;s++){const l=document.createElement('div');l.className='lab';l.textContent=N[OPEN[s]];b.appendChild(l);for(let f=0;f<=12;f++){const c=document.createElement('div');c.className='cell',ix=p.indexOf((OPEN[s]+f)%12);if(ix>=0){const d=document.createElement('span');d.className='dot '+(ix===0?'root':ix===1?'third':ix===2?'fifth':'sev');d.textContent=f;c.appendChild(d)}b.appendChild(c)}}}function show(t){if(!segments.length)return;let i=segments.findIndex(s=>t>=s.start&&t<s.end);if(i<0)i=segments.length-1;if(i===current)return;current=i;document.querySelectorAll('.seg').forEach((x,k)=>x.classList.toggle('on',k===i));board(segments[i].pcs)}function tick(){const t=audio.currentTime||0,d=audio.duration||0;$('seek').value=d?t/d*1000:0;$('clock').textContent=fmt(t)+' / '+fmt(d);$('head').style.left=(d?t/d*100:0)+'%';show(t);raf=requestAnimationFrame(tick)}file.onchange=()=>load(file.files[0]);['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('over')}));['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('over')}));drop.ondrop=e=>load([...e.dataTransfer.files][0]);$('analyse').onclick=analyse;$('play').onclick=()=>audio.paused?audio.play():audio.pause();audio.onloadedmetadata=tick;$('seek').oninput=e=>audio.currentTime=e.target.value/1000*(audio.duration||0);$('wave').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*(audio.duration||0)};$('back').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-5);$('fwd').onclick=()=>audio.currentTime=Math.min(audio.duration||0,audio.currentTime+5);$('send').onclick=()=>{const g=$('grid').value.trim();if(!g)return;const title=($('name').textContent||'Audio').replace(/\.[^.]+$/,'');const payload={t:title,c:g};const hash=encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(payload)))));parent.location.href='app.html#brano='+hash};addEventListener('resize',draw);addEventListener('beforeunload',()=>{cancelAnimationFrame(raf);if(url)URL.revokeObjectURL(url)});board([])})();
</script></body></html>
