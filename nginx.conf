server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # MIME types come from /etc/nginx/mime.types (included by the http block of
  # nginx:1.27-alpine). It already maps js, json, svg, webp, png, mp3 and wasm
  # (application/wasm). Do NOT add a server-level types {} block: it would
  # replace the whole table.

  gzip on;
  gzip_types text/css text/javascript application/javascript application/json
             application/wasm image/svg+xml application/xml;

  # Server-level headers. Any location that declares its own add_header loses
  # these, so they are re-declared there.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  # HTML / SPA fallback: always revalidate.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
  }

  # Bundle and stylesheet are cache-busted with ?v=<version> in the HTML.
  # The demo MP3s in assets/pieces/ are not versioned but rarely change.
  location /assets/ {
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
  }

  # The separator worker, ONNX runtime and model are loaded without ?v=, so a
  # week-long cache could pair a new bundle with an old worker. Revalidate
  # instead: unchanged files cost only a 304. The model itself is also kept
  # in Cache Storage by the app.
  location /assets/separator/ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # mjs is not in the stock mime.types; inherits the headers above.
    location ~* \.mjs$ {
      types { text/javascript mjs; }
    }
  }
}
